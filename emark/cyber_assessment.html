egion":"国际标准(R155 的事实落地方法)","scope":"定义从概念、开发到生产运维的网络安全工程流程;TARA 是其核心方法。是证明 R155 符合性的主要技术依据。","points":["面向风险的全生命周期工程(概念/开发/生产/运维/退役)","TARA:资产→威胁→攻击路径→影响→风险值→处置","要求工作产物与证据链(可审计);用 CAL 分级严苛度","分布式开发责任划分(OEM↔供应商,DIA 接口协议)"],"timeline":"2021 发布;当前行业基线。"},{"name":"ISO 26262 — 功能安全(ASIL)","id":"ISO 26262","region":"国际标准","scope":"功能安全标准,与网络安全需协同(安全-安全集成):安全攸关功能须考虑被攻击导致的失效。","points":["ASIL A–D 风险分级(严重度×暴露×可控性)","HARA(危害分析)与 TARA 需对齐","安全机制不得被网络攻击绕过","Security 为 Safety 提供完整性前提"],"timeline":"2018(第二版)。"},{"name":"欧盟网络弹性法案(Cyber Resilience Act)","id":"EU CRA","region":"欧盟","scope":"面向所有含数字要素的产品(横向法),强制安全设计、漏洞处理与上报义务;与车辆 R155 并行适用于车载数字组件/后端。","points":["默认安全设计 + 全生命周期漏洞管理","已知被利用漏洞须在 24 小时内向 ENISA 上报","提供 SBOM 与安全更新支持期","不合规可处全球营业额比例罚款"],"timeline":"2024-12 生效;主要义务 2026–2027 分阶段适用。"},{"name":"NIST 后量子密码(FIPS 203/204/205)","id":"NIST PQC","region":"美国 NIST(全球参考)","scope":"抗量子算法标准:车辆生命周期长(10–15 年),今日加密数据面临『先窃取后解密』风险,需规划密码敏捷与迁移。","points":["FIPS 203 ML-KEM(密钥封装,替代 Kyber/ECDH)","FIPS 204 ML-DSA(签名,替代 Dilithium)/ 205 SLH-DSA(哈希签名)","密码敏捷(crypto-agility):可在线升级算法","OTA/Secure Boot 签名链优先迁移规划"],"timeline":"2024-08 正式发布;车规迁移规划应即启动。"},{"name":"ISO 14229 — UDS 统一诊断服务","id":"ISO 14229","region":"国际标准(诊断协议基座)","scope":"定义 ECU 诊断/编程/标定的服务集(SID);OBD-II 端口与 UDS-over-DoIP 是主要汽车攻击向量,ISO 21434 要求对所有诊断接口做 TARA。","points":["0x27 Security Access(种子-密钥)已可被 0x29 Authentication(证书/HMAC,HSM 支撑)取代","0x34/0x36 刷写、0x2E 标定写入等敏感服务须分会话/分安全级管控","失败锁定 NRC 0x37、S3 会话超时 5 秒兜底","DoIP(ISO 13400-2:2019)支持 TLS 1.3 双向认证"],"timeline":"ISO 14229-1:2020(现行);0x29 Authentication 为该版新增服务。"}]};
const ANS_KEY='emark_cyber_assess_v1', SUM_KEY='emark_cyber_summary_v1';
let ans={};
try{ ans=JSON.parse(localStorage.getItem(ANS_KEY))||{}; }catch(e){ ans={}; }
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function domScore(d){ if(!d.items.length)return 0; let s=0; d.items.forEach(it=>s+=(ans[it.k]||0)); return s/(2*d.items.length); }
function level(sc){ return 1+Math.round(sc*4); }
function stats(){
  let done=0,total=0; CYBER.domains.forEach(d=>d.items.forEach(it=>{total++;if((ans[it.k]||0)===2)done++;}));
  const ov=CYBER.domains.reduce((a,d)=>a+domScore(d),0)/CYBER.domains.length;
  const lv=level(ov);
  return {overall:ov,pct:Math.round(ov*100),level:lv,levelName:CYBER.levels[lv-1]||'',done,total};
}
function radarSVG(size){
  const axes=CYBER.domains.map(d=>({n:d.name.replace(/[（(].*$/,'').slice(0,6),v:Math.round(domScore(d)*100)}));
  const N=axes.length,R=(size||250)/2-42,cx=(size||250)/2,cy=(size||250)/2+4;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const ring=f=>axes.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ');
  const poly=axes.map((ax,i)=>pt(i,R*ax.v/100).map(v=>v.toFixed(1)).join(',')).join(' ');
  const labels=axes.map((ax,i)=>{const p=pt(i,R+16);const x=p[0],y=p[1];const anch=Math.abs(x-cx)<8?'middle':(x>cx?'start':'end');
    return '<text x="'+x.toFixed(1)+'" y="'+(y+4).toFixed(1)+'" font-size="9.5" fill="#6B7280" text-anchor="'+anch+'">'+esc(ax.n)+'</text>';}).join('');
  const spokes=axes.map((_,i)=>{const p=pt(i,R);return '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#ECEEF1"/>';}).join('');
  return '<svg viewBox="0 0 '+(size||250)+' '+(size||250)+'" width="100%" style="max-width:'+(size||250)+'px" aria-label="网安成熟度雷达图">'+
    [0.25,0.5,0.75,1].map(f=>'<polygon points="'+ring(f)+'" fill="none" stroke="#ECEEF1"/>').join('')+spokes+
    '<polygon points="'+poly+'" fill="rgba(232,98,44,.18)" stroke="#E8622C" stroke-width="1.8" stroke-linejoin="round"/>'+
    axes.map((ax,i)=>{const p=pt(i,R*ax.v/100);return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.6" fill="#E8622C"/>';}).join('')+labels+'</svg>';
}
function persist(){
  try{ localStorage.setItem(ANS_KEY,JSON.stringify(ans)); }catch(e){}
  try{
    const st=stats();
    const summary={level:st.level,levelName:st.levelName,overallPct:st.pct,done:st.done,total:st.total,
      domains:CYBER.domains.map(d=>({name:d.name,pct:Math.round(domScore(d)*100)})),ts:Date.now(),
      started:Object.keys(ans).some(k=>ans[k]>0)};
    localStorage.setItem(SUM_KEY,JSON.stringify(summary));
  }catch(e){}
}
function setItem(k,v){ ans[k]=v; persist(); render(); }
function resetAll(){ if(!confirm('清空全部网安自评答案？此操作不可撤销。'))return; ans={}; persist(); render(); }
function render(){
  const st=stats();
  document.getElementById('summary').innerHTML=
    '<div class="sum"><div class="rad">'+radarSVG(250)+'</div><div class="info">'+
    '<div class="lv">整体成熟度 <b>L'+st.level+' · '+esc(st.levelName)+'</b></div>'+
    '<div class="meta">综合完成度 <b>'+st.pct+'%</b> · 已达成 '+st.done+'/'+st.total+' 项 · 共 '+CYBER.domains.length+' 域 · 三档:'+CYBER.labels.map(esc).join(' / ')+'</div>'+
    '<div class="pills">'+CYBER.levels.map((n,i)=>'<span class="pill'+(i+1===st.level?' on':'')+'">L'+(i+1)+' '+esc(n)+'</span>').join('')+'</div>'+
    '</div></div>';
  let h='';
  CYBER.domains.forEach((d,di)=>{
    const sc=domScore(d),dlv=level(sc);
    h+='<div class="dom"><h2>'+(di+1)+'. '+esc(d.name)+' <span class="dl">本域 L'+dlv+' · '+Math.round(sc*100)+'%</span></h2><div class="dd">'+esc(d.desc)+'</div>';
    d.items.forEach(it=>{
      const v=ans[it.k]||0;
      const seg=[0,1,2].map(kk=>'<button class="'+(v===kk?'on '+(kk===2?'done-b':kk===1?'prog-b':'no-b'):'')+'" onclick="setItem(\''+it.k+'\','+kk+')">'+esc(CYBER.labels[kk])+'</button>').join('');
      h+='<div class="arow"><div class="al"><b>'+esc(it.t)+'</b>'+(it.r?'<small>依据:'+esc(it.r)+'</small>':'')+'</div><div class="seg">'+seg+'</div></div>';
    });
    h+='</div>';
  });
  document.getElementById('domains').innerHTML=h;
  if(CYBER.standards&&CYBER.standards.length){
    let s='<div class="std"><h3>相关标准 / 法规速览</h3>';
    CYBER.standards.forEach(x=>{
      s+='<details><summary>'+esc(x.name)+' · '+esc(x.id)+(x.region?' · '+esc(x.region):'')+'</summary>'+
        (x.scope?'<div class="sc">'+esc(x.scope)+'</div>':'')+
        (x.points&&x.points.length?'<ul>'+x.points.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>':'')+
        (x.timeline?'<div class="tl">⏱ '+esc(x.timeline)+'</div>':'')+'</details>';
    });
    s+='</div>';
    document.getElementById('standards').innerHTML=s;
  }
}
// 返回:优先回到打开本页的上一个标签(history),否则跳评估工具
(function(){
  const bl=document.getElementById('backlink'), bb=document.getElementById('backbtn');
  [bl,bb].forEach(el=>{ if(el) el.addEventListener('click',function(e){
    if(window.opener && !window.opener.closed){ e.preventDefault(); window.close(); }
  }); });
})();
persist(); render();
</script>
