<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深度网安成熟度自评 · R155/R156 · ISO 21434</title>
<style>
:root{--o:#E8622C;--od:#C44E1E;--ol:#FBE4D7;--ink:#1A1D21;--ink2:#3A3F46;--grey:#6B7280;--greyl:#9AA1AB;--line:#E3E6EA;--bg:#F7F8FA;--card:#FFF;--cream:#FDF6F0;--green:#1F7A4D;--red:#C0392B;--amber:#B45309}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC",-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
a{color:var(--od)}
.hero{background:linear-gradient(120deg,var(--ink),#2A2F36);color:#fff;padding:20px 26px;position:sticky;top:0;z-index:30}
.hero .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero h1{font-size:18px;margin:0;font-weight:900;letter-spacing:.5px}
.hero .sub{font-size:12px;color:#c9ced4;margin-top:2px}
.hero .back{margin-left:auto;font-size:13px;color:#fff;background:rgba(255,255,255,.14);border:none;border-radius:9px;padding:9px 15px;cursor:pointer;text-decoration:none;font-family:inherit}
.hero .back:hover{background:rgba(255,255,255,.28)}
.wrap{max-width:1040px;margin:0 auto;padding:20px 20px 60px}
.ico{width:15px;height:15px;display:inline-block;vertical-align:-2px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-right:5px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px;align-items:center}
.btn{font-family:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.p{background:var(--o);border-color:var(--o);color:#fff}
.btn:hover{border-color:var(--o);color:var(--od)}
.btn.p:hover{background:var(--od);color:#fff}
/* 顶部成熟度概览 */
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(16,24,40,.05);display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.sum .rad{flex:none;width:210px}
.sum .info{flex:1;min-width:200px}
.sum .lv{font-size:18px;font-weight:900}
.sum .lv b{color:var(--od)}
.sum .meta{font-size:12.5px;color:var(--ink2);margin:5px 0 10px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--grey)}
.pill.on{border-color:var(--o);color:var(--od);font-weight:700;background:var(--cream)}
/* 侧边栏布局（对齐合规工具 Step4） */
.sb{display:grid;grid-template-columns:232px 1fr;gap:16px}
@media(max-width:760px){.sb{grid-template-columns:1fr;gap:10px}}
.sb-nav{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:96px}
@media(max-width:760px){.sb-nav{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px}}
.sb-item{display:flex;align-items:center;gap:9px;text-align:left;font-family:inherit;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;color:var(--ink);white-space:nowrap;flex:none;transition:.12s}
.sb-item:hover{border-color:var(--o)}
.sb-item.on{border-color:var(--o);background:var(--cream);font-weight:700}
.sb-dot{width:10px;height:10px;border-radius:50%;flex:none}
.sb-item .tx{display:flex;flex-direction:column;line-height:1.3}
.sb-item small{color:var(--greyl);font-size:11px;font-weight:400}
.sb-main{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;box-shadow:0 1px 3px rgba(16,24,40,.04)}
.sb-mh{font-size:16px;font-weight:800;color:var(--od);margin-bottom:4px}
.sb-msub{font-size:12px;color:var(--grey);margin-bottom:12px}
.lvbox{background:var(--cream);border-radius:9px;padding:9px 12px;margin-bottom:12px;font-size:11.5px}
.lvbox .lr{display:flex;gap:8px;padding:2px 0}
.lvbox .lr b{flex:none;width:26px;color:var(--grey)}
.lvbox .lr.cur b,.lvbox .lr.cur span{color:var(--od);font-weight:700}
.arow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;border-top:1px solid var(--line);padding:11px 0}
.arow:first-of-type{border-top:none}
.al b{font-weight:600;font-size:13px}
.al small{display:block;color:var(--grey);font-size:11px;margin-top:2px;font-family:ui-monospace,Menlo,Consolas,monospace}
.seg{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{font-family:inherit;font-size:12px;font-weight:600;border:none;background:#fff;padding:8px 13px;cursor:pointer;color:var(--grey);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{color:#fff}
.seg button.on.done-b{background:var(--green)}
.seg button.on.prog-b{background:var(--amber)}
.seg button.on.no-b{background:var(--red)}
.std details{border-top:1px solid var(--line);padding:9px 0}
.std details:first-of-type{border-top:none}
.std summary{cursor:pointer;font-size:13px;font-weight:600}
.std .sc{font-size:12px;color:var(--ink2);margin:6px 0 4px}
.std ul{margin:4px 0;padding-left:18px;font-size:12px}
.std .tl{font-size:11px;color:var(--od);font-family:ui-monospace,Menlo,Consolas,monospace}
.note{font-size:11.5px;color:var(--grey);background:#FBF7F2;border-left:3px solid var(--o);border-radius:0 8px 8px 0;padding:10px 14px;margin-top:16px;line-height:1.7}
/* 影响驾驶舱 */
.ckpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kc{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kc .kl{font-size:11.5px;color:var(--grey)}
.kc .kv{font-size:26px;font-weight:800;line-height:1.15;margin:2px 0}
.kc .kbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin:2px 0 6px}
.kc .kbar>div{height:100%}
.kc .kn{font-size:10.5px;color:var(--grey);font-family:ui-monospace,Menlo,Consolas,monospace}
.cktab{border-collapse:collapse;font-size:11.5px;min-width:820px}
.cktab th{padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap;text-align:center;font-weight:700}
.cktab th.lft,.cktab td.lft{text-align:left;position:sticky;left:0;background:var(--card)}
.cktab tr{border-top:1px solid var(--line)}
.cktab td{padding:6px 8px;text-align:center}
.cktab td.dash{color:var(--greyl)}
.cktab .rd{font-size:10px;color:var(--grey);font-weight:400}
.cbadge{display:inline-block;padding:2px 8px;border-radius:11px;font-size:10.5px;font-weight:600}
.ckleg{font-size:11px;color:var(--grey);font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:10px;line-height:1.9}
.tag-ed{font-size:10.5px;font-weight:700;color:var(--od);background:var(--cream);border:1px solid var(--ol);border-radius:20px;padding:1px 8px;vertical-align:2px}
.ckhint{font-size:11.5px;color:var(--ink2);background:var(--cream);border-left:3px solid var(--o);border-radius:0 8px 8px 0;padding:8px 12px;margin:8px 0 12px;line-height:1.6}
.cin{font-family:inherit;font-size:12px;width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 7px;color:var(--ink);background:#fff}
.cin:focus{outline:none;border-color:var(--o)}
select.cin{font-size:13.5px;padding:6px 7px;cursor:pointer}
/* 自定义下拉:按钮 + 弹层(字号完全可控) */
.lvlbtn{font-family:inherit;font-size:13.5px;width:100%;text-align:left;border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:#fff;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:4px}
.lvlbtn:hover{border-color:var(--o)}
.lvlbtn .cae{color:var(--greyl);font-size:11px;flex:none}
.lvlmenu{position:absolute;z-index:200;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 28px rgba(16,24,40,.2);padding:5px;display:none}
.lvlmenu.on{display:block}
.lvlmenu button{display:block;width:100%;text-align:left;font-family:inherit;font-size:14px;border:none;background:#fff;padding:9px 13px;border-radius:6px;cursor:pointer;color:var(--ink);white-space:nowrap}
.lvlmenu button:hover{background:var(--cream)}
.lvlmenu button.sel{color:var(--od);font-weight:700;background:var(--cream)}
.cin.num{width:72px;flex:none;text-align:center}
.cin.sm{font-size:11px;margin-top:5px;color:var(--grey)}
.cin.col{min-width:104px}
.cktab td,.cktab th{vertical-align:top;min-width:104px}
.cktab td.lft,.cktab th.lft{min-width:156px;max-width:220px;white-space:normal}
.cktab td .cin.lvl{width:100%;margin-bottom:4px}
.cktab td .cin.num2{width:100%;text-align:center}
/* 档案栏 */
.pbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.pbar #pname{font-family:inherit;font-size:13px;min-width:220px;flex:0 1 300px;border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--ink);background:#fff}
.pbar #pname:focus{outline:none;border-color:var(--o)}
.pstate{font-size:11.5px;color:var(--grey);white-space:nowrap}
.btn.sm{font-size:12px;font-weight:600;padding:6px 11px;border-radius:8px}
/* 我的档案 模态 */
.pmodal{position:fixed;inset:0;background:rgba(20,24,28,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:60px 16px;overflow-y:auto}
.pmodal.on{display:flex}
.pmbox{background:#fff;border-radius:14px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.pmh{background:linear-gradient(120deg,var(--ink),#2A2F36);color:#fff;padding:14px 18px;font-size:15px;font-weight:700;display:flex;align-items:center}
.pmx{margin-left:auto;background:rgba(255,255,255,.15);border:none;color:#fff;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:14px}
.pmx:hover{background:rgba(255,255,255,.3)}
.pmlist{padding:12px 16px 18px;max-height:64vh;overflow-y:auto}
.pmrow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.pmrow.cur{border-color:var(--o);background:var(--cream)}
.pmn{flex:1;font-size:13.5px;font-weight:700;min-width:0}
.pmcur{font-size:10.5px;font-weight:700;color:var(--od);background:#fff;border:1px solid var(--ol);border-radius:20px;padding:1px 8px}
.pmd{font-size:11px;color:var(--grey);font-weight:400;margin-top:2px}
.pmbtns{display:flex;gap:6px;flex:none}
.pmempty{font-size:13px;color:var(--grey);text-align:center;padding:24px 8px}
/* 侧栏分组标签 */
.navsep{font-size:10.5px;font-weight:700;color:var(--greyl);letter-spacing:.5px;margin:10px 2px 2px;text-transform:none}
/* 21434 风险评级表 */
.taratab{border-collapse:collapse;font-size:12.5px;min-width:760px;width:100%}
.taratab th{padding:8px 10px;border-bottom:2px solid var(--line);text-align:center;font-weight:700;white-space:nowrap;color:var(--ink2)}
.taratab th.lft{text-align:left}
.taratab td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.taratab td.lft{min-width:300px}
.taratab .tnum{flex:none;width:22px;height:22px;border-radius:50%;background:var(--cream);color:var(--od);font-weight:700;font-size:11px;display:grid;place-items:center;margin-top:5px}
.taratab .lvlbtn{min-width:96px}
.rvb{display:inline-block;min-width:34px;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:800}
.muted{color:var(--greyl)}
.delx{border:none;background:none;color:var(--greyl);cursor:pointer;font-size:14px;padding:4px}
.delx:hover{color:var(--red)}
/* 参照矩阵 */
.mtxwrap{display:flex;gap:20px;flex-wrap:wrap;margin-top:18px}
.mtxh{font-size:12.5px;font-weight:700;margin-bottom:6px}
.mtxh span{font-weight:400;color:var(--grey);font-size:10.5px}
.mtx{border-collapse:collapse;font-size:11.5px}
.mtx th{padding:5px 9px;border:1px solid var(--line);background:var(--bg);font-weight:600;white-space:nowrap}
.mtx td{padding:6px 12px;border:1px solid var(--line);text-align:center;font-weight:700}
.mtx td.lft{text-align:left;font-weight:600;background:var(--bg);white-space:nowrap}
</style>
</head>
<body>
<div class="hero"><div class="in">
  <div>
    <h1>深度网安成熟度自评</h1>
    <div class="sub">ISO 21434 风险评级(TARA → 风险值 / CAL 1–4) + 成熟度自查 · R155 附件 5 威胁目录</div>
  </div>
  <a class="back" href="emark_assessment.html" id="backlink">← 返回 E-mark 评估</a>
</div></div>
<div class="wrap">
  <div class="pbar">
    <input id="pname" placeholder="档案名称（如 Model X 2027 / 欧盟项目）" autocomplete="off">
    <button class="btn p" id="savebtn" onclick="saveProgress()">保存进度</button>
    <button class="btn" onclick="newProfile()">＋ 新建档案</button>
    <button class="btn" onclick="openProfiles()">我的档案</button>
    <span id="pstate" class="pstate"></span>
    <span style="flex:1"></span>
    <a class="btn" href="emark_assessment.html" id="backbtn">← 返回评估工具</a>
  </div>
  <div id="summary"></div>
  <div class="sb">
    <div class="sb-nav" id="nav"></div>
    <div class="sb-main" id="main"></div>
  </div>
  <div class="note">成熟度模型内容蒸馏自公开网络安全手册与 ISO/SAE 21434、UN R155/R156，用于团队自查参照，<b>非型式批准结论</b>；正式判定以认可技术服务 / 批准机关为准。评估与驾驶舱数据按<b>档案</b>保存在本浏览器，并把成熟度摘要回传给 E-mark 评估工具 Step 4 展示。</div>
</div>
<div id="lvlmenu" class="lvlmenu"></div>
<div id="pmodal" class="pmodal" onclick="if(event.target===this)closeProfiles()">
  <div class="pmbox">
    <div class="pmh">我的档案 <button class="pmx" onclick="closeProfiles()" aria-label="关闭">✕</button></div>
    <div id="pmlist" class="pmlist"></div>
  </div>
</div>

/* ===== ISO/SAE 21434 风险评级(TARA → 风险值 1–5 / CAL 1–4)=====
   影响分级 Impact(Cl.15.3,取 S/F/O/P 最严)× 攻击可行性 Attack Feasibility(Cl.15.4)
   → 风险值 Risk Value 1–5(Cl.15.5,示例矩阵,组织可裁剪)
   → CAL 1–4(附录 E,资料性,概念阶段按影响×可行性定保障严苛度)。R155 本身无等级。*/
const IMPACTS=[['Severe','严重'],['Major','重大'],['Moderate','中等'],['Negligible','轻微']];
const FEAS=[['VeryLow','极低'],['Low','低'],['Medium','中'],['High','高']]; // 索引 0..3
// 风险值矩阵 RISK[impact][feasIdx] (feasIdx: 0极低..3高) — 21434 Cl.15.5 示例
const RISK={Severe:[2,3,4,5],Major:[1,2,3,4],Moderate:[1,2,2,3],Negligible:[1,1,1,1]};
// CAL 矩阵 CAL_TBL[impact][feasIdx] — 21434 附录 E(资料性)
const CAL_TBL={Severe:[1,2,3,4],Major:[1,1,2,3],Moderate:[1,1,1,2],Negligible:[0,0,0,0]}; // 0 = 无需 CAL
const RISK_COL={1:['#e7ecef','#4b5563'],2:['#d9e8d1','#3d6b2c'],3:['#f4e6bd','#7a5a10'],4:['#f6ddc9','#a2531f'],5:['#f3d0d0','#b02222']};
const CAL_COL={0:['#eef0f2','#9aa1ab'],1:['#d9e8d1','#3d6b2c'],2:['#f4e6bd','#7a5a10'],3:['#f6ddc9','#a2531f'],4:['#f3d0d0','#b02222']};
function impactCn(k){const o=IMPACTS.find(x=>x[0]===k);return o?o[1]:'';}
function feasCn(k){const o=FEAS.find(x=>x[0]===k);return o?o[1]:'';}
function feasIdx(k){return FEAS.findIndex(x=>x[0]===k);}
function riskOf(t){ if(!t||!t.impact||!t.feas)return null; const i=feasIdx(t.feas); if(i<0)return null; return (RISK[t.impact]||[])[i]??null; }

function taraStats(){

  return {total:tara.length,rated:rated.length,calCount,riskCount,maxCal,maxRisk};

function domScore(d){ if(!d.items.length)return 0; let s=0; d.items.forEach(it=>s+=(ans[it.k]||0)); return s/(2*d.items.length); }

function stats(){
  let done=0,total=0; CYBER.domains.forEach(d=>d.items.forEach(it=>{total++;if((ans[it.k]||0)===2)done++;}));
  const ov=CYBER.domains.reduce((a,d)=>a+domScore(d),0)/CYBER.domains.length;
  const lv=level(ov);
  return {overall:ov,pct:Math.round(ov*100),level:lv,levelName:CYBER.levels[lv-1]||'',done,total};
}
function radarSVG(size){
  const axes=CYBER.domains.map(d=>({n:d.name.replace(/[（(].*$/,'').slice(0,6),v:Math.round(domScore(d)*100)}));
  const N=axes.length,R=(size||210)/2-38,cx=(size||210)/2,cy=(size||210)/2+2;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const ring=f=>axes.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ');
  const poly=axes.map((ax,i)=>pt(i,R*ax.v/100).map(v=>v.toFixed(1)).join(',')).join(' ');
  const labels=axes.map((ax,i)=>{const p=pt(i,R+15);const x=p[0],y=p[1];const anch=Math.abs(x-cx)<8?'middle':(x>cx?'start':'end');
    return '<text x="'+x.toFixed(1)+'" y="'+(y+4).toFixed(1)+'" font-size="9" fill="#6B7280" text-anchor="'+anch+'">'+esc(ax.n)+'</text>';}).join('');
  const spokes=axes.map((_,i)=>{const p=pt(i,R);return '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="#ECEEF1"/>';}).join('');
  return '<svg viewBox="0 0 '+(size||210)+' '+(size||210)+'" width="100%" style="max-width:'+(size||210)+'px" aria-label="网安成熟度雷达图">'+
    [0.25,0.5,0.75,1].map(f=>'<polygon points="'+ring(f)+'" fill="none" stroke="#ECEEF1"/>').join('')+spokes+
    '<polygon points="'+poly+'" fill="rgba(232,98,44,.18)" stroke="#E8622C" stroke-width="1.8" stroke-linejoin="round"/>'+
    axes.map((ax,i)=>{const p=pt(i,R*ax.v/100);return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.6" fill="#E8622C"/>';}).join('')+labels+'</svg>';
}

      '<div style="min-width:220px;flex:1"><div class="sb-mh" style="margin-bottom:2px">ISO 21434 风险评级 · TARA → 风险值 / CAL</div>'+
      '<div class="sb-msub" style="margin-bottom:0">逐条威胁按 <b>影响(Cl.15.3)× 攻击可行性(Cl.15.4)</b> → 风险值 1–5(Cl.15.5)与 CAL 1–4(附录 E)。种子取自 <b>UN R155 附件 5</b> 威胁目录,可增删改。</div></div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;flex:none"><button class="btn p" onclick="taraAdd()">＋ 添加威胁</button><button class="btn" onclick="taraReseed()">↺ 恢复 R155 目录</button></div></div>';
    s+='<div style="overflow:auto"><table class="taratab"><tr><th class="lft">#　威胁场景 / 资产 / 依据</th><th>影响 Impact</th><th>攻击可行性</th><th>风险值</th><th>CAL</th><th></th></tr>';
    tara.forEach((t,i)=>{
      const rv=riskOf(t), cal=calOf(t);
      const rc=rv?RISK_COL[rv]:null, cc=(cal!=null)?CAL_COL[cal]:null;
      s+='<tr><td class="lft"><div style="display:flex;gap:7px"><span class="tnum">'+(i+1)+'</span><div style="flex:1;min-width:0">'
        + '<input class="cin" value="'+escA(t.name)+'" placeholder="威胁场景" oninput="taraField('+i+',\'name\',this.value)">'
        + '<div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">'
        +   '<input class="cin sm" style="flex:1;min-width:90px" value="'+escA(t.asset)+'" placeholder="资产 / 目标" oninput="taraField('+i+',\'asset\',this.value)">'
        +   '<input class="cin sm" style="flex:1;min-width:120px" value="'+escA(t.ref)+'" placeholder="依据(如 R155 附件5 §…)" oninput="taraField('+i+',\'ref\',this.value)">'
        + '</div></div></div></td>'
        + '<td><button class="lvlbtn" onclick="taraImpactOpen('+i+',this,event)">'+(t.impact?esc(impactCn(t.impact)):'—')+' <span class="cae">▾</span></button></td>'
        + '<td><button class="lvlbtn" onclick="taraFeasOpen('+i+',this,event)">'+(t.feas?esc(feasCn(t.feas)):'—')+' <span class="cae">▾</span></button></td>'
        + '<td style="text-align:center">'+(rv?'<span class="rvb" style="background:'+rc[0]+';color:'+rc[1]+'">'+rv+'</span>':'<span class="muted">—</span>')+'</td>'
        + '<td style="text-align:center">'+(cal!=null?(cal>0?'<span class="rvb" style="background:'+cc[0]+';color:'+cc[1]+'">CAL '+cal+'</span>':'<span class="muted">无需</span>'):'<span class="muted">—</span>')+'</td>'
        + '<td style="text-align:center"><button class="delx" onclick="taraDel('+i+')" title="删除该行">✕</button></td></tr>';
    });
    s+='</table></div>';
    s+=taraRefHTML();
    m.innerHTML=s; return;
  }
  if(active==='cockpit'){
    const cp=cockpit, ed=ckEdit;
    const LVLS=['High','Support','Medium','Trace'];
    let s='<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-bottom:6px">';
    s+='<div style="min-width:220px;flex:1"><div class="sb-mh" style="margin-bottom:2px">'+esc(cp.title||'证据—法规影响驾驶舱')+'</div>'+
      '<div class="sb-msub" style="margin-bottom:0">'+esc(cp.subtitle||'')+'</div></div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;flex:none">'+
      '<button class="btn'+(ed?' p':'')+'" onclick="ckToggle()">'+(ed?'✓ 完成编辑':'✎ 编辑驾驶舱')+'</button>'+
      (ed?'<button class="btn" onclick="ckClear()">清空</button><button class="btn" onclick="ckSeed()">载入示例</button>':'')+'</div></div>';
    if(ed) s+='<div class="ckhint">按团队真实工程证据填写:改风险仪表(名称/数值/口径/说明)、法规体系列头、每格证据强度(High 强证据 / Support 支撑 / Medium 中等 / Trace 可追溯 / — 无)与百分比。改动即时存入当前档案。</div>';
    // KPI
    s+='<div class="ckpi">'+cp.kpis.map((k,i)=>{
      const col=CK_TONE[k.tone]||'var(--greyl)';
      const hasV=k.value!=null&&k.value!=='';
      const v=hasV?Math.max(0,Math.min(100,+k.value||0)):null;
      if(ed){
        return '<div class="kc"><input class="cin" value="'+escA(k.label)+'" placeholder="仪表名称" oninput="ckKpi('+i+",'label',this.value)\">"+
          '<div style="display:flex;gap:6px;align-items:center;margin:6px 0"><input class="cin num" type="number" min="0" max="100" value="'+(hasV?v:'')+'" placeholder="—" oninput="ckKpi('+i+",'value',this.value)\"><span style=\"font-size:12px;color:var(--grey)\">%</span></div>"+
          '<button class="lvlbtn" style="margin-bottom:6px" onclick="toneOpen('+i+',this,event)">'+esc(toneLabel(k.tone))+' <span class="cae">▾</span></button>'+
          '<input class="cin" value="'+escA(k.note)+'" placeholder="说明 / 依据" oninput="ckKpi('+i+",'note',this.value)\"></div>";
      }
      return '<div class="kc"><div class="kl">'+esc(k.label)+'</div><div class="kv" style="color:'+(hasV?col:'var(--greyl)')+'">'+(hasV?v+'%':'—')+'</div>'+
        '<div class="kbar"><div style="width:'+(hasV?v:0)+'%;background:'+col+'"></div></div><div class="kn">'+(esc(k.note||'')||'&nbsp;')+'</div></div>';
    }).join('')+'</div>';
    // 矩阵
    const cols=cp.cols||[];
    s+='<div style="font-size:12.5px;font-weight:700;margin:16px 0 4px">证据域影响矩阵 <span style="font-weight:400;color:var(--grey);font-size:11px">证据域 × 法规体系的证据就绪度;法规矩阵仍是条款的事实来源</span></div>';
    s+='<div style="overflow:auto"><table class="cktab"><tr><th class="lft">证据域</th>'+
      cols.map((c,ci)=>ed?'<th><input class="cin col" value="'+escA(c)+'" placeholder="法规体系" oninput="ckCol('+ci+',this.value)"></th>':'<th>'+esc(c)+'</th>').join('')+'</tr>';
    (cp.rows||[]).forEach((r,ri)=>{
      let head=ed
        ? '<td class="lft"><input class="cin" value="'+escA(r.domain)+'" placeholder="证据域" oninput="ckRow('+ri+",'domain',this.value)\"><input class=\"cin sm\" value=\""+escA(r.desc||'')+'" placeholder="证据说明" oninput="ckRow('+ri+",'desc',this.value)\"></td>"
        : '<td class="lft"><b>'+esc(r.domain)+'</b>'+(r.desc?'<div class="rd">'+esc(r.desc)+'</div>':'')+'</td>';
      s+='<tr>'+head+(cols.map((_,ci)=>{
        const cell=(r.cells||[])[ci];
        if(ed){
          const lv=cell&&cell.level!=null?cell.level:'';
          const pc=cell&&cell.pct!=null?cell.pct:'';
          return '<td><button class="lvlbtn" onclick="lvlOpen('+ri+','+ci+',this,event)">'+(lv?esc(lv):'— 无')+' <span class="cae">▾</span></button>'+
            '<input class="cin num2" type="number" min="0" max="100" value="'+pc+'" placeholder="%" oninput="ckCell('+ri+','+ci+",'pct',this.value)\"></td>";
        }
        if(!cell||cell.level==null)return '<td class="dash">–</td>';
        const st=CK_LVL[cell.level]||['#eee','#555'];
        return '<td><span class="cbadge" style="background:'+st[0]+';color:'+st[1]+'">'+esc(cell.level)+(cell.pct!=null?' '+cell.pct+'%':'')+'</span></td>';
      }).join(''))+'</tr>';
    });
    s+='</table></div>';
    s+='<div class="ckleg">图例:'+(cp.levels||[]).map(l=>{const st=CK_LVL[l.key]||['#eee','#555'];return '<span class="cbadge" style="background:'+st[0]+';color:'+st[1]+'">'+esc(l.label)+'</span>';}).join(' ')+' · 就绪度由团队按真实工程证据维护;随当前档案保存,「保存进度 / 我的档案」在顶部。</div>';
    m.innerHTML=s; return;
  }
  if(active==='std'){
    let s='<div class="sb-mh">相关标准 / 法规速览</div><div class="sb-msub">点击展开每项的适用范围、要点与时间线。</div><div class="std">';
    (CYBER.standards||[]).forEach((x,i)=>{
      s+='<details'+(i===0?' open':'')+'><summary>'+esc(x.name)+' · '+esc(x.id)+(x.region?' · '+esc(x.region):'')+'</summary>'+
        (x.scope?'<div class="sc">'+esc(x.scope)+'</div>':'')+
        (x.points&&x.points.length?'<ul>'+x.points.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>':'')+
        (x.timeline?'<div class="tl">⏱ '+esc(x.timeline)+'</div>':'')+'</details>';
    });
    s+='</div>'; m.innerHTML=s; return;
  }
  const d=CYBER.domains[active],sc=domScore(d),dlv=level(sc);
  let h='<div class="sb-mh">'+(active+1)+'. '+esc(d.name)+'</div><div class="sb-msub">'+esc(d.desc)+' · 本域 <b style="color:var(--od)">L'+dlv+' · '+Math.round(sc*100)+'%</b></div>';
  if(d.levels&&d.levels.length===5){
    h+='<div class="lvbox">'+d.levels.map((lx,i)=>'<div class="lr'+(i+1===dlv?' cur':'')+'"><b>L'+(i+1)+'</b><span>'+esc(lx)+(i+1===dlv?'　← 当前':'')+'</span></div>').join('')+'</div>';
  }
  d.items.forEach(it=>{
    const v=ans[it.k]||0;
    const seg=[0,1,2].map(kk=>'<button class="'+(v===kk?'on '+(kk===2?'done-b':kk===1?'prog-b':'no-b'):'')+'" onclick="setItem(\''+it.k+'\','+kk+')">'+esc(CYBER.labels[kk])+'</button>').join('');
    h+='<div class="arow"><div class="al"><b>'+esc(it.t)+'</b>'+(it.r?'<small>依据:'+esc(it.r)+'</small>':'')+'</div><div class="seg">'+seg+'</div></div>';
  });
  m.innerHTML=h;
}
function render(){ renderSummary(); renderNav(); renderMain(); }
(function(){
  const bl=document.getElementById('backlink'), bb=document.getElementById('backbtn');
  [bl,bb].forEach(el=>{ if(el) el.addEventListener('click',function(e){
    if(window.opener && !window.opener.closed){ e.preventDefault(); window.close(); }
  }); });
})();
(function init(){
  const ps=getProfiles(), id=activeId();
  if(id&&ps[id]){ applyState(ps[id].state); const el=document.getElementById('pname'); if(el) el.value=ps[id].name||''; }
  else {
    // 首次:迁移旧的自评答案(真实输入)作为草稿;驾驶舱一律空白起步(不再带示意种子)
    let migAns=null; try{ migAns=JSON.parse(localStorage.getItem(OLD_ANS)); }catch(e){}
    ans=(migAns&&typeof migAns==='object')?migAns:{};
    cockpit=blankCockpit();
    tara=seedTara();
    try{ localStorage.removeItem(OLD_CK); }catch(e){} // 清掉旧驾驶舱种子缓存
  }
  updatePBar(); writeSummary(); render();
})();
</script>
</body>
