<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-mark 合规成熟度评估 · 一点通</title>
<style>
:root{--o:#E8622C;--od:#C44E1E;--ol:#FBE4D7;--ink:#1A1D21;--ink2:#3A3F46;--grey:#6B7280;--greyl:#9AA1AB;--line:#E3E6EA;--bg:#F7F8FA;--card:#FFF;--cream:#FDF6F0;--blue:#2563EB;--purple:#7C3AED;--green:#1F7A4D;--red:#C0392B;--amber:#B45309}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}
.hero{background:linear-gradient(120deg,#fff,#FDF6F0);border-bottom:1px solid var(--line)}
.hi{max-width:1000px;margin:0 auto;padding:40px 24px 36px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.dot{width:26px;height:26px;border-radius:7px;background:var(--o);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.brand b{font-size:15px}.brand span{color:var(--grey);font-size:13px}
h1{font-size:31px;font-weight:800;letter-spacing:-.4px;margin-bottom:8px}
h1 .em{color:var(--o)}
.sub{font-size:15px;color:var(--ink2);max-width:620px;margin-bottom:20px}
.badges{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}
.badge{font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 13px;color:var(--ink2)}
.badge b{color:var(--o)}
.btn{font-family:inherit;font-size:15px;font-weight:700;border:none;border-radius:9px;padding:13px 26px;cursor:pointer;transition:.15s}
.btn-p{background:var(--o);color:#fff;box-shadow:0 2px 10px rgba(232,98,44,.28)}
.btn-p:hover{background:var(--od);transform:translateY(-1px)}
.btn-o{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.rail{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.ri{max-width:1000px;margin:0 auto;padding:14px 24px;display:flex;gap:0;overflow-x:auto}
.rstep{display:flex;align-items:center;font-size:13px;color:var(--greyl);white-space:nowrap;cursor:pointer;transition:color .15s}
.rstep:hover{color:var(--ink)}
.rstep:hover .n{border-color:var(--o)}
.rstep .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;margin-right:7px;background:#fff;transition:border-color .15s}
.rstep.done .n{background:var(--ol);border-color:var(--o);color:var(--od)}
.rstep.active .n{background:var(--o);border-color:var(--o);color:#fff}
.rstep.active{color:var(--ink);font-weight:700}
.rstep::after{content:"";width:22px;height:1.5px;background:var(--line);margin:0 10px}
.rstep:last-child::after{display:none}
main{padding:34px 0 80px;min-height:60vh}
.step{display:none;animation:fade .3s}
.step.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--o);text-transform:uppercase;margin-bottom:8px}
h2.st{font-size:24px;font-weight:800;margin-bottom:6px}
.lead{color:var(--ink2);font-size:14.5px;margin-bottom:24px;max-width:680px}
.opts{display:grid;gap:12px}
.opts.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.opts.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.opt{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;transition:.15s;text-align:left;font-family:inherit}
.opt:hover{border-color:var(--o);transform:translateY(-1px);box-shadow:0 4px 16px rgba(232,98,44,.1)}
.opt.sel{border-color:var(--o);background:var(--cream)}
.opt .ot{font-size:15px;font-weight:700;margin-bottom:3px}
.opt .od{font-size:12.5px;color:var(--grey)}
.nav{display:flex;justify-content:space-between;margin-top:30px;gap:12px}
.ghost{background:none;border:none;color:var(--grey);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:12px 6px}
.ghost:hover{color:var(--ink)}
/* self-assessment rows */
.secttl{font-size:16px;font-weight:800;margin:22px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--ol);color:var(--od)}
.arow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px}
.arow.has-sub{grid-template-columns:auto 1fr auto}
.subchk{display:flex;flex-direction:column;align-items:center;gap:3px;width:52px;flex-shrink:0;cursor:pointer;user-select:none}
.subchk input{width:15px;height:15px;accent-color:var(--od);cursor:pointer;margin:0}
.subchk span{font-size:9.5px;color:var(--greyl);line-height:1.25;text-align:center}
.subchk.on span{color:var(--od);font-weight:700}
.arow .al{font-size:13.5px}
.arow .al b{font-weight:700}.arow .al small{color:var(--grey);font-size:12px}
/* 拆分组：分组标题 + 缩进子行 */
.arow-gh{font-size:13px;color:var(--ink);background:var(--cream);border-radius:9px;padding:9px 14px;margin:12px 0 6px}
.arow-gh b{font-weight:800}.arow-gh small{color:var(--od);font-size:11.5px;margin-left:2px}
.ghico{color:var(--o);font-weight:800;margin-right:6px}
.arow-sub{margin-left:20px;border-left:3px solid var(--ol)}
/* 二选一等效项 */
.alt-tag{display:inline-block;font-size:10.5px;font-weight:800;color:#40300A;background:#FFE9A8;border-radius:5px;padding:2px 8px;margin:0 8px 4px 0;vertical-align:middle}
.alt-opt{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px;background:#F7F5EE;border:1px solid var(--line);border-radius:8px;padding:4px 9px;margin:4px 0}
.alt-r{font-size:12.5px;font-weight:800;color:var(--ink)}
.alt-cn{font-size:11.5px;color:var(--grey)}
.alt-sep{display:inline-block;font-size:11.5px;font-weight:700;color:var(--od);margin:0 8px}
.seg{display:flex;gap:0;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font-family:inherit;font-size:12px;font-weight:600;border:none;background:#fff;padding:8px 12px;cursor:pointer;color:var(--grey);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{color:#fff}
.seg button.on.done-b{background:var(--green)}
.seg button.on.prog-b{background:#E7A400;color:#40300A}
.seg button.on.no-b{background:var(--red)}
.seg button.on.unk-b{background:var(--greyl)}
/* Step 3 结构总览轨 */
.s3-view{margin:2px 0 12px}
.s3-toggle{font-family:inherit;font-size:12px;font-weight:600;color:var(--od);background:#fff;border:1px solid var(--ol);border-radius:7px;padding:6px 12px;cursor:pointer}
.s3-toggle:hover{background:var(--cream)}
.struct{background:var(--cream);border:1px solid var(--ol);border-radius:12px;padding:15px 17px;margin-bottom:14px}
.struct-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.stabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.stab{font-family:inherit;font-size:12.5px;font-weight:600;border:none;background:#fff;color:var(--grey);padding:7px 14px;cursor:pointer}
.stab.on{background:var(--o);color:#fff}
.struct-ring{display:flex;align-items:center;gap:11px}
.wring{width:50px;height:50px;flex:none;position:relative}
.wr-bg{fill:none;stroke:#EBDFD4;stroke-width:6}
.wr-fg{fill:none;stroke:var(--green);stroke-width:6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:32px 32px;transition:stroke-dashoffset .5s}
.struct-ring .wr-t{margin-left:-40px;width:34px;text-align:center;font-size:13px;font-weight:800;color:var(--ink)}
.struct-ktr{font-size:12px;color:var(--ink2);line-height:1.5;margin-left:4px}.struct-ktr small{color:var(--grey)}
.sblock{margin-top:11px}
.sblock-h{display:flex;align-items:baseline;gap:8px;font-size:12.5px;margin-bottom:7px}
.sblock-h b{color:var(--od);font-weight:700}.sblock-n{font-weight:700;color:var(--ink)}.sblock-h small{color:var(--grey);font-size:11px;margin-left:auto}
.stiles{display:flex;flex-wrap:wrap;gap:5px}
.stile{font-family:inherit;font-size:10.5px;font-weight:700;color:#fff;background:var(--c);border:none;border-radius:5px;padding:4px 8px;cursor:pointer;opacity:.9;transition:.12s}
.stile:hover{opacity:1;transform:translateY(-1px);box-shadow:0 2px 6px rgba(16,24,40,.18)}
.s3-secttl{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
.s3-ttl-t{flex:1 1 auto;min-width:0}
.regsearch-wrap{display:inline-flex;align-items:center;gap:8px;flex:0 0 auto}
.regsearch{font-family:inherit;font-size:12.5px;font-weight:400;color:var(--ink);background:#fff;border:1px solid #D9DCE1;border-radius:18px;padding:7px 14px;width:260px;max-width:52vw;transition:.12s}
.regsearch:focus{outline:none;border-color:var(--o);box-shadow:0 0 0 3px rgba(198,80,42,.12)}
.regsearch-cnt{font-size:11.5px;font-weight:600;color:var(--grey);white-space:nowrap;min-width:44px}
.stile.dim{opacity:.16}
.stile.hit{opacity:1;outline:2px solid var(--od);outline-offset:1px;box-shadow:0 2px 6px rgba(16,24,40,.2)}
.arow.hit{background:var(--cream);border-radius:8px}
.slegend{display:flex;gap:15px;margin-top:13px;padding-top:11px;border-top:1px dashed var(--ol);font-size:11px;color:var(--grey)}
.slegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* 版本时效自查表 */
.vb-sum{font-size:12.5px;color:var(--ink2);margin-bottom:11px}
.vb-k{font-weight:700}.vb-k.behind{color:var(--red)}.vb-k.cur{color:var(--green)}.vb-k.unk{color:var(--grey)}
.vb-scroll{max-height:66vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.vb-tbl{min-width:1040px}
.vb-tbl td small{color:var(--grey);font-size:11.5px}
.vb-tbl td{vertical-align:top;white-space:nowrap}
.vb-tbl td:first-child,.vb-tbl td:first-child small{white-space:normal;min-width:150px}
.vb-tbl .vb-euim,.vb-tbl .vb-tpnote,.vb-tbl .vb-fnnote,.vb-tbl .vb-c4,.vb-tbl .vb-fn{white-space:normal}
.vb-tbl .vb-eif{color:var(--grey)}
.vb-tpnote{margin-top:5px;font-size:10.5px;line-height:1.5;color:var(--od);background:#FBF3E8;border-radius:5px;padding:4px 6px}
.vb-fnnote{margin-top:5px;font-size:10.5px;line-height:1.5;color:var(--blue);background:#EEF3FA;border-radius:5px;padding:4px 6px}
.vb-eu-na{color:var(--greyl);font-size:11px}
.vb-euver{font-size:11.5px;color:var(--ink2)}
.vb-euim{margin-top:5px;font-size:10.5px;line-height:1.5;color:var(--blue);background:#EEF3FA;border-radius:5px;padding:4px 6px}
.vb-euim-h{display:block;font-weight:700;color:var(--od);margin-bottom:1px}
.vb-euim.vb-euim-na{color:var(--greyl);background:transparent;padding:2px 0;font-style:italic}
.vb-eu{display:inline-block;font-size:9.5px;font-weight:700;color:var(--blue);background:#EAF1F7;border-radius:4px;padding:1px 5px;margin-left:4px}
.vb-c4{font-size:10.5px;color:var(--od);margin-top:2px}
.vb-fn{border-bottom:1px dotted var(--grey);cursor:help}
.vb-legal{display:inline-block;font-size:9.5px;font-weight:700;color:#fff;background:#8A1C1C;border-radius:4px;padding:1px 5px;margin-left:3px;vertical-align:1px}
.vb-txtcut{display:inline-block;font-size:9.5px;font-weight:700;color:#8A1C1C;background:#F7E3E0;border:1px solid #C98A80;border-radius:4px;padding:1px 5px;margin-left:3px;vertical-align:1px;cursor:help}
.vb-txtlate{font-size:10.5px;color:var(--od);border-bottom:1px dotted var(--od);cursor:help}
.cv-wrap{display:flex;flex-direction:column;gap:14px;padding:2px 0}
.cv-sec{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.cv-h{display:flex;align-items:center;gap:9px;background:var(--panel);padding:8px 12px;font-weight:700;font-size:13.5px;color:var(--ink)}
.cv-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:700}
.cv-h .cv-n{margin-left:auto;font-size:11px;font-weight:600;color:var(--grey)}
.cv-tbl{margin:0}
.cv-tbl td.cv-sub{font-weight:600;color:var(--ink);width:34%}
.cv-tbl td.cv-reg{font-family:var(--mono,monospace);font-size:11.5px;color:var(--od);width:38%}
.cv-tbl td.cv-cat{font-size:11px;color:var(--grey)}
.dv-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;padding:8px 12px}
.dv-sum{font-size:13px;color:var(--ink2);margin:4px 0 10px;padding-left:2px}
@media(max-width:640px){.dv-grid{grid-template-columns:1fr}}
.vb-proxy{color:var(--grey)}.vb-proxy-t{font-size:10px;color:var(--greyl)}
.vb-row-b{background:#FCEFEC}
.vb-row-eu{background:#EAF1FB}
.vb-legend2{font-size:11px;color:var(--grey);margin:-4px 0 11px;line-height:1.7}
.vb-legend2 .lg{white-space:nowrap}.vb-legend2 .lg::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.vb-legend2 .lg-eu::before{background:#2E6FB8}.vb-legend2 .lg-red::before{background:#C0392B}.vb-legend2 .lg-cur::before{background:var(--green)}
.vb-b.euref{background:#2E6FB8;color:#fff;line-height:1.25;text-align:center}
.vb-b.euref small{font-weight:400;opacity:.9}
.vb-b{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 8px;white-space:nowrap}
.vb-b.behind{background:#C0392B;color:#fff}.vb-b.cur{background:#E7F3EC;color:var(--green)}.vb-b.ahead{background:#EAF1F7;color:var(--blue)}.vb-b.unk{background:#f0efe9;color:var(--grey)}
.arow.flash{animation:flashrow 1.4s ease}
@keyframes flashrow{0%,100%{background:#fff}28%{background:var(--ol)}}
/* result */
.rhd{background:linear-gradient(120deg,var(--ink),#2A2F36);color:#fff;border-radius:16px;padding:28px 30px;margin-bottom:22px}
.rlabel{font-size:12px;letter-spacing:1.5px;color:var(--o);font-weight:700;text-transform:uppercase;margin-bottom:10px}
.rhd h2{font-size:26px;color:#fff;margin-bottom:4px}
.rhd .qname{font-size:15px;color:#C9CDD3}
.scores{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.score .sv{font-size:34px;font-weight:800}
.score .sl{font-size:12px;color:#C9CDD3}
.quad-wrap{display:grid;grid-template-columns:320px 1fr;gap:22px;margin-bottom:24px;align-items:start}
@media(max-width:720px){.quad-wrap{grid-template-columns:1fr}}
.quad{position:relative;width:300px;height:300px;background:#fff;border:1px solid var(--line);border-radius:12px}
.quad .lbl{position:absolute;font-size:11px;font-weight:700;color:var(--greyl)}
.quad .cell{position:absolute;width:50%;height:50%;display:grid;place-items:center;font-size:12px;font-weight:700;opacity:.85}
.marker{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--o);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);transform:translate(-50%,-50%);z-index:5}
.rcard-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:22px}
.rcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.rcard .rk{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--o);text-transform:uppercase;margin-bottom:7px}
.rcard .rv{font-size:14px;line-height:1.5}
.gaplist{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:22px}
.gaphd{background:var(--cream);padding:14px 18px;font-weight:800;font-size:15px;color:var(--od);border-bottom:1px solid var(--ol)}
.gap{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);font-size:13.5px}
.gap:last-child{border-bottom:none}
.gdot{width:10px;height:10px;border-radius:50%}
.gdot.red{background:var(--red)}.gdot.amber{background:var(--amber)}
.gsvc{font-size:12px;font-weight:700;color:var(--o);background:var(--ol);padding:4px 11px;border-radius:12px;white-space:nowrap}
.cta-box{background:linear-gradient(120deg,var(--o),var(--od));color:#fff;border-radius:16px;padding:26px 30px;text-align:center;margin-top:8px}
.cta-box h3{font-size:20px;margin-bottom:6px;color:#fff}
.cta-box p{color:#FCE8DD;font-size:14px;margin-bottom:16px}
.cta-box .btn{background:#fff;color:var(--od)}
.heat{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.hcell{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff}
.foot{text-align:center;color:var(--greyl);font-size:12px;padding:26px 0}
/* live version cell (Step 2) */
.ver{display:block;margin-top:4px;font-size:11.5px}
.ver.load{color:var(--greyl)}
.ver.ok{color:var(--green)}
.ver.ok b{color:var(--od)}
.ver.snap{color:var(--grey)}
.ver.na{color:var(--greyl)}
.ver.eu{color:#2563EB}
.verhint{font-size:12px;color:var(--grey);margin:2px 0 10px}
.verhint b{color:var(--o)}
/* 内行反馈条（每步选择后的专业提示） */
.probe{font-size:12.5px;color:var(--ink2);background:var(--cream);border-left:3px solid var(--o);border-radius:0 8px 8px 0;padding:9px 13px;margin:10px 0 4px;line-height:1.65}
.probe b{color:var(--od)}
.xgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px;margin-top:10px}
.cybr{background:linear-gradient(120deg,#fff,var(--cream));border:1.5px solid var(--ol);border-radius:12px;padding:14px 16px;margin:6px 0 14px}
.cybr .ct{font-weight:800;font-size:13.5px;color:var(--od);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.cybr .cm{font-size:12px;color:var(--ink2);margin:6px 0 8px;line-height:1.65}
.cybr .clv{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--ol);border-radius:20px;padding:3px 11px;font-size:12.5px;font-weight:700;color:var(--od)}
.cybar{display:grid;grid-template-columns:96px 1fr 36px;gap:8px;align-items:center;font-size:11.5px;margin:3px 0}
.cybar>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.cybar .bt{background:var(--line);border-radius:6px;height:7px;overflow:hidden}
.cybar .bf{height:100%;background:var(--o);border-radius:6px}
.cybtn{font-family:inherit;font-size:12.5px;font-weight:700;color:#fff;background:var(--o);border:none;border-radius:9px;padding:9px 16px;cursor:pointer;margin-top:8px}
.cybtn:hover{background:var(--od)}
.cybtn.ghost{background:#fff;color:var(--od);border:1.5px solid var(--ol)}
.cybtn.ghost:hover{background:var(--cream)}
.ver.warn{color:var(--amber);font-weight:600}
.vehb{display:inline-block;font-size:10.5px;color:var(--blue);background:#EAF1F7;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.powb{display:inline-block;font-size:10.5px;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.powb.na{color:var(--grey);background:#f0efe9;border:1px dashed var(--line)}
.arow.pt-na{opacity:.62}
.arow.pt-na .al b{font-weight:600}
.iwb{display:inline-block;font-size:10.5px;color:var(--purple);background:#EEE9F7;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.mkb{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.mkb-e{color:var(--od);background:var(--ol)}
.mkb-le{color:#fff;background:var(--blue)}
.mkb-n{color:var(--greyl);background:#EEF0F2;font-weight:400}
.mkb-ce{color:#7A3E00;background:#FBE7CF}

.ico{width:15px;height:15px;display:inline-block;vertical-align:-2px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-right:5px}

.opt,.rcard,.gaplist,.reglist,.stn-extra,.emk-modal,.jcard{border-color:#ECEEF1!important;box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.05)}

/* 去除所有虚线框（表单感的主要来源）*/
.disc{border-style:solid;border-color:var(--ol);background:var(--cream);color:var(--ink2)}

.secttl{border-bottom-width:1px;border-color:var(--line)}
.mkb,.emk-search input,.stn-extra,.verhint+*{border-radius:8px}

.probe{background:#FBF7F2;border-left:3px solid var(--o)}

.deliv{background:#fff;border:1px solid #ECEEF1;border-radius:10px;padding:13px 15px;margin-top:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}

.chk{display:flex;align-items:flex-start;gap:9px;padding:7px 4px;border-radius:7px;cursor:pointer;transition:.12s}
.chk:hover{background:var(--cream)}

.chk-t{font-size:13px;line-height:1.5;color:var(--ink)}
.chk-t small{display:block;font-size:11.5px;color:var(--grey)}
.chk.on .chk-t{color:var(--grey);text-decoration:line-through;text-decoration-color:#C9CFD8}

.tpl-link{display:inline-block;font-size:11.5px;font-weight:700;color:var(--blue);text-decoration:none}
.tpl-link:hover{text-decoration:underline}
.ap-block{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px}
.ap-h{font-size:12px;font-weight:700;color:var(--grey);margin-bottom:8px}
.ap-row{font-size:13px;line-height:2;color:var(--ink)}
.ap-sum{font-size:13px;line-height:1.7;color:var(--ink)}
.ap-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.ap-act{font-weight:700;margin-left:4px;color:var(--od)}
.ap-done{background:#EAF5EE;border:1px solid #BFE2CB;border-radius:10px;padding:11px 14px;margin-top:12px;font-size:13px;color:#1F7A4D;font-weight:600}
.tpl-note{font-size:11.5px;color:var(--grey);line-height:1.6;padding:8px 12px;border-top:1px solid #F1F2F4;margin-top:2px}

.faq{border-bottom:1px solid var(--line);padding:4px 0}
.faq:last-child{border-bottom:none}
.faq summary{font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;padding:9px 4px;list-style:none;display:flex;align-items:center;gap:8px}

/* ===== 单一数据源:Step3「法规盘点」ITEMS 的法规编号统一由型批全表 EU_ITEMS 派生，
   两套数据不再各自维护、避免漂移。EU_ITEMS 为权威超集(130 项)，ITEMS(94 项)取其子集。===== */
function toCompactReg(r){
  r=String(r||'').trim();
  if(!r) return '—';
  if(/UN Regulation No/i.test(r)){
    var nums=(r.match(/No\s*(\d{1,3}(?:-H)?(?:\.\d{2})?)/gi)||[]).map(function(x){return 'R'+x.replace(/No\s*/i,'');});
    return nums.length?('UN '+nums.join(' / ')):r;
  }
  return r.replace(/Regulation\s+\((E[UC])\)\s*(?:No\s*)?/i,'($1) ').replace(/,\s*Annex/,' Annex');
}
// 适用车型：从 EU_ITEMS.c（源=2018/858 Annex II + 2019/2144 Annex I）派生 item→车型码集合。空=通用（不按车型收敛）
const ITEM_CATS={};
(function(){ var em={}; EU_ITEMS.forEach(function(x){em[x.it]=x;});
  ITEMS.forEach(function(it){ var e=em[it.item]; if(e&&(e.r||'').trim()) it.reg=toCompactReg(e.r);
    ITEM_CATS[it.item]=(e&&e.c?e.c.split(',').map(function(s){return s.trim();}).filter(Boolean):[]); }); })();

/* ===== Task 2 · 活数据：法规现行版本 / 生效日期（WP.29/343） ===== */
let VERDB=null, VERSTATE='loading';   // loading | ok | fail
function parseEif(a){
  if(a && a.eif) return a.eif;                                   // 已归一 ISO
  const raw=((a&&a.eif_raw)||'').replace(/[\[\]]/g,'').trim();   // 去掉 [暂定] 括号
  const m=/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/.exec(raw);
  if(!m) return null;
  let y=m[3]; if(y.length===2) y='20'+y;
  return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
}
function buildVerDB(json){
  const byNo={}; (json.regs||[]).forEach(r=>{byNo[String(r.no)]=r;});
  return {byNo, as_of:json.as_of||''};
}
// 按 UN R 编号 + series 匹配，取该 series 下最新 eif；
// 匹配不到申报系列时，回退到该编号下"当前已生效的最新修订"（现行版本）。
// 兼容：R13-H 这类带后缀编号、状态写成裸"00"（非"00 series"）的数据。
function liveVersion(regStr){
  if(!VERDB) return null;
  const m=/(?:UN\s*)?R\s*(\d{1,3}(?:-H)?)\.(\d{2})/i.exec(regStr||'');
  if(!m) return null;
  const no=m[1].toUpperCase(), series=m[2];
  const reg=VERDB.byNo[no] || VERDB.byNo[no.replace(/-/g,'')];
  if(!reg) return null;
  const sN=String(+series); // 去前导零，"03"→"3"，用于宽松匹配
  // 裸系列("00"/"03")、"NN series"、"Suppl.X to NN" 三种写法都认
  const re=new RegExp('^(?:0*'+sN+'(?:\\s*series)?|Suppl\\.?\\s*\\d+\\s*to\\s*0*'+sN+')$','i');
  let best=null;
  (reg.amendments||[]).forEach(a=>{
    if(re.test((a.status||'').trim())){
      const e=parseEif(a);
      if(e && (!best || e>best.eif)) best={status:a.status.trim(), eif:e};
    }
  });
  if(best) return best;
  // 回退：申报系列没匹配到（如数据里已升到更高系列）→ 取当前已生效的最新修订
  const today=new Date().toISOString().slice(0,10);
  (reg.amendments||[]).forEach(a=>{
    const e=parseEif(a);
    if(e && e<=today && (!best || e>best.eif)) best={status:a.status.trim(), eif:e};
  });
  return best;
}
// 该 UN R 编号下已生效的最高修订系列（仅统计 "NN series" 且 eif ≤ 今天）
function latestInForceSeries(no){
  if(!VERDB) return null;
  const reg=VERDB.byNo[String(no)]; if(!reg) return null;
  const today=new Date().toISOString().slice(0,10);
  let best=null;
  (reg.amendments||[]).forEach(a=>{
    const m=/^(\d{2})\s*series$/i.exec((a.status||'').trim()); if(!m) return;
    const e=parseEif(a); if(!e||e>today) return;
    const n=+m[1]; if(best==null||n>best) best=n;
  });
  return best;
}

 ts:{t:'技术服务机构（Technical Service）',d:'获批准机关<b>认可、执行法规规定测试</b>的实验室（SGS 即为其一）。出具测试报告供机关审批。与"批准机关"是两个角色。'},
 esa:{t:'电子子组件 ESA',d:'Electronic Sub-Assembly——可<b>独立于整车</b>单独型式批准的车载电子装置（控制器、灯具电子模块等）。UN R10 允许 ESA 独立认证。'},
 wvta:{t:'整车型式批准 WVTA / IWVTA',d:'Whole Vehicle Type Approval——对<b>整车</b>（而非单个部件）的型式批准。整车层面三种批准并存：<b>① UN R0 IWVTA</b>（1958 协定的整车批准，即「整车的大 E 体系」）：仅限 <b>M1 乘用车</b>量产完成车（R0 ¶1.1）；分 <b>U-IWVTA</b>（Annex 4 全部 43 项 UN 法规按规定或更新版本全满足，适用 R0 的缔约方须接受，¶2.3.1）与 <b>L-IWVTA</b>（未全满足/按旧版，认可有限，¶2.3.2）；整车须贴 IWVTA 型批标志（含字母 <b>U</b>，¶4.5 + Annex 2）。<b>② EU-WVTA</b>（2018/858）：进入欧盟市场的整车证（e+国别 编号），覆盖排放/尺寸等 IWVTA 不含的要求，U-IWVTA 在其中作为 UN 法规部分的合规证据。<b>③ 部件大 E</b>：两种整车证共同的组成部分。整车必备 43 项见「IWVTA 清单」按钮。'},
 stu:{t:'独立技术单元 STU',d:'Separate Technical Unit——可单独型式批准的装置，但仅针对一种或多种指定车型、且相关法规明文允许时。<br>定义原文：(EU) 2018/858 <b>Art 3(20)</b>。'},
 eif:{t:'生效日期 vs 强制适用日',d:'两者不同、勿混：<b>UNECE 增补生效日</b>＝某 UN 法规该系列/增补自此可获批准并在缔约方间互认（本工具版本标注用此，源自 WP.29/343 Add.2）；<b>EU 强制适用日</b>＝欧盟自此拒绝对不合规新型式批准（(EU) 2019/2144 <b>Art 16</b> + Annex II 所列日期）。'}
};
function openGloss(key){const g=GLOSSARY[key];if(!g)return;
  emkModal(g.t, `<div style="padding:16px 18px;font-size:13px;line-height:1.75;color:var(--ink2)">${g.d}</div>`,
    '<button class="dirbtn" style="margin:0" onclick="openGlossary()"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.5 5 8 4.5 4 5v13c4-.5 6.5 0 8 1.5 1.5-1.5 4-2 8-1.5V5c-4-.5-6.5 0-8 1.5Z"/><path d="M12 6.5V19"/></svg>查看全部术语</button>');}
function openGlossary(){
  const rows=Object.keys(GLOSSARY).map(k=>`<tr><td style="white-space:nowrap;font-weight:700;color:var(--od)">${GLOSSARY[k].t}</td><td>${GLOSSARY[k].d}</td></tr>`).join('');
  emkModal('术语速查 · E-mark 认证常用词', `<table class="emk-tbl gloss-tbl">${rows}</table>`,
    '为便于理解编写的通俗释义；正式定义以 UNECE / 欧盟官方法规文本为准。');
}

function gloss(key,label){return `<button class="gloss" onclick="event.stopPropagation();openGloss('${key}')" title="点看释义">${label}<sup>?</sup></button>`;}

// 一条法规行里所有在库的 R 号（组合项如 R31/R98/R112/... 全部列出）
function srcNos(reg){
  const raw=(reg||'').match(/R\s*\d{1,3}/gi)||[];
  const seen=new Set(), out=[];
  raw.forEach(s=>{const n=s.replace(/\D/g,'');if((REG_SRC[n]||REG_META[n])&&!seen.has(n)){seen.add(n);out.push(n);}});
  return out;
}
function srcChip(i){const nos=srcNos(i.reg);if(!nos.length)return '';
  const label=nos.length>1?`适用范围·${nos.length}`:'适用范围';
  return `<button class="srcb" onclick="openRegSrc('${nos.join(',')}')" title="适用范围与测试内容（欧盟合并版原文）">${label}</button>`;}
function regBlock(no){const s=REG_SRC[no], m=REG_META[no]||{}; if(!s&&!REG_META[no])return '';
  const zh=s?s.zh:(m.s||'—'), cats=s?s.cats:(m.c||'—');
  return `<div style="margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)">
    <div style="font-weight:800;color:var(--od);margin-bottom:6px">UN R${no}</div>
    <div style="margin-bottom:7px"><b>适用范围</b>：${zh}</div>
    <div style="margin-bottom:7px"><b>适用车型类别</b>：${cats}</div>
    ${s&&s.t?`<div style="margin-bottom:7px"><b>测试内容</b>：${s.t}</div>`:''}
    ${m.sr?`<div style="margin-bottom:7px"><b>EU 要求系列</b>：${m.sr}<span style="color:var(--greyl);font-size:11px">（2019/2144 Annex I）</span></div>`:''}
    ${m.im?`<div style="margin-bottom:7px"><b>EU 强制实施日期</b>：${m.im}<span style="color:var(--greyl);font-size:11px">（2018/858 Annex II）</span></div>`:''}
    ${m.n?`<div style="margin-bottom:7px"><b>适用细则/备注</b>：${m.n}</div>`:''}
    ${m.oj?`<div style="margin-bottom:7px"><b>官方公报 OJ</b>：${m.oj}</div>`:''}
    ${s&&s.ver?`<div style="margin-bottom:7px"><b>现行合并版</b>：${s.ver}</div>`:''}
    ${s&&s.en?`<div style="background:var(--bg);border-radius:8px;padding:9px 11px;font-size:12px;color:var(--ink2);line-height:1.6"><span style="color:var(--greyl);font-size:11px">原文摘录（Scope §1）</span><br>${s.en}</div>`:''}
  </div>`;}

  const rows=EU_ITEMS.map(x=>{const m=x.rno?REG_META[x.rno]:null;

// 该 UN R 编号的各「系列」时间线：生效日(eif) + 下一系列生效日(supEif)；expired/future 为内部标记（UI 不展示「被取代」口径）
function regSeriesTimeline(no){
  const reg=VERDB.byNo[String(no)]||VERDB.byNo[String(no).replace(/-/g,'')]; if(!reg) return null;
  const map={};
  (reg.amendments||[]).forEach(a=>{const m=/^(\d{2})\s*series$/i.exec((a.status||'').trim());if(!m)return;
    const n=+m[1],e=a.eif;if(!e)return; if(map[n]==null||e<map[n]) map[n]=e;});
  const nums=Object.keys(map).map(Number).sort((a,b)=>a-b);
  const today=new Date().toISOString().slice(0,10);
  const series=nums.map((n,idx)=>{const eif=map[n];const supEif=idx<nums.length-1?map[nums[idx+1]]:null;
    return {n,eif,supEif,expired:!!(supEif&&supEif<=today),future:eif>today};});
  let latest=null; series.forEach(s=>{if(!s.future&&(latest==null||s.n>latest))latest=s.n;});
  return {series,latest};
}

function d2iso(s){const m=/^(\d{2})-(\d{2})-(\d{4})$/.exec(s||'');return m?m[3]+'-'+m[2]+'-'+m[1]:(s||'');}
function _esc(s){return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
// 工具涉及的 UN R 编号 → 覆盖主题 + EU 强制适用日（据 (EU) 2019/2144 Art 16 + Annex II，存于 EU_ITEMS.im）
function unRegsInScope(){
  const emIm={}; EU_ITEMS.forEach(x=>{ if(x.im&&x.im.trim()) emIm[x.it]=x.im.trim(); });
  const map={}, imMap={};
  ITEMS.forEach(i=>{ (regTokens(i.reg)||[]).forEach(k=>{const mm=/^UN R(\d{1,3}(?:-H)?)$/.exec(k);if(!mm)return;
    const no=mm[1]; (map[no]||(map[no]=[])).push(i.cn);
    const im=emIm[i.item]; if(im){ (imMap[no]||(imMap[no]=new Set())).add(im); } }); });
  return Object.keys(map).sort((a,b)=>parseInt(a)-parseInt(b)||a.localeCompare(b))
    .map(no=>({no,subjects:[...new Set(map[no])],ims:[...(imMap[no]||new Set())]}));
}
function openVersionBoard(){

      else if(isLatest) stat='<span class="vb-b cur">现行</span>';
      else stat='';   // 非最新系列不作标注：系列更替不影响既有证书效力（业主指示删「已被取代」标签，只留法定失效）

function upcomingAmendment(no){

  const reg=VERDB.byNo[String(no)]; if(!reg) return null;
  const today=new Date().toISOString().slice(0,10);
  let best=null;
  (reg.amendments||[]).forEach(a=>{
    const e=parseEif(a); if(!e||e<=today) return;

// 从法规文本(紧凑格式)抽取规范化法规号：UN R21.01→UN R21；(EU) 2021/535 Annex XIV→(EU) 2021/535；Directive 2005/64/EC
function regTokens(s){
  s=s||''; const out=[]; let m;
  const re1=/UN\s*R\s?(\d{1,3}(?:-H)?)/gi;
  while((m=re1.exec(s))) out.push('UN R'+m[1].toUpperCase());
  const re2=/\((EU|EC)\)\s*(?:No\s*)?(\d{1,4}\/\d{2,4})/gi;
  while((m=re2.exec(s))) out.push('('+m[1]+') '+m[2]);
  const re3=/Directive\s*(\d{4}\/\d+\/E[UC])/gi;
  while((m=re3.exec(s))) out.push('Directive '+m[1]);
  return out;
}
// 当前页「适用法规明细」：从 applicable() 汇总去重的每条法规 + 其覆盖的主题清单（用于 02/03 步右栏动态列出）
function pageRegList(){
  const map=new Map(); // key -> Set(主题短名)
  applicable().forEach(i=>{
    regTokens(i.reg).forEach(k=>{
      if(!map.has(k)) map.set(k,new Set());
      if(i.cn) map.get(k).add(i.cn);
    });
  });
  const rank=k=>{ let mm=k.match(/^UN R(\d+)(-H)?$/); if(mm) return [0,+mm[1],mm[2]?1:0];
    mm=k.match(/^\((EU|EC)\) (\d+)\/(\d+)$/); if(mm) return [1,+mm[3],+mm[2]]; return [2,0,0]; };
  return [...map.entries()].map(([k,subs])=>({k,subs:[...subs]}))
    .sort((a,b)=>{const x=rank(a.k),y=rank(b.k);return x[0]-y[0]||x[1]-y[1]||x[2]-y[2];});
}

// ===== 捆绑多法规盘点项 → 逐条子项展开（业主指示：拆开，保留分组标题+子行）=====
// 一个盘点项若对应多条不同 UN 法规（灯具/信号/防盗/轮胎/噪声簇），展开为每条法规一行，各自独立版本/国互认/自评。
const SPLIT_REGS={
  C10:['30','117'],
  D3:['97','116','161','162','163'],
  D11:['4','6','7','19','23','38','77','87','91','148'],
  D12:['31','98','112','119','123','149'],
  D13:['3','104','150'],
  D14:['37','99','128'],
  G1:['51','59']
};
const SUB_CN={'51':'噪声排放（M/N 类车辆）','59':'替换消声系统'};   // 不在 REG_META 内的补名
function _srNN(sr){ if(!sr) return ''; if(/原始版/.test(sr)) return '00'; const m=/(\d{2})\s*series/i.exec(sr); return m?m[1]:''; }
// 生成某捆绑项的子项数组（合成 item，复用既有徽标/版本渲染）；名称与引用系列取自 REG_META
function subItemsOf(p){
  const nos=SPLIT_REGS[p.item]; if(!nos) return null;
  return nos.map(no=>{
    const rm=REG_META[no]||{}; const nn=_srNN(rm.sr);
    return {item:p.item+'#'+no, cn:(rm.s||SUB_CN[no]||('UN R'+no)), reg:'UN R'+no+(nn?'.'+nn:''),
            mark:'E', tc:p.tc, g:p.g, eif:'', _parent:p.item, _pcn:p.cn, _no:no};
  });
}
// ===== 二选一等效项（业主指示）：两条法规对同一要求等效，取得任一批准即可，不拆成两行、保持单一自评 =====
// A8 儿童座椅固定点：R145（专项）或 R14（含 ISOFIX 固定点条款）任一批准均可（UNECE 官方：三种固定点按 R14 或 R145 批准）
const ALT_REGS={A8:['145','14']};
// 渲染并列的两个等效法规选项，各带自己的中文名/引用系列/国互认/现行版本
function altInfo(i){
  const alts=ALT_REGS[i.item]; if(!alts) return '';
  const opts=alts.map(no=>{
    const rm=REG_META[no]||{}; const nn=_srNN(rm.sr);
    const si={item:i.item+'@'+no, cn:rm.s, reg:'UN R'+no+(nn?'.'+nn:''), mark:'E', tc:i.tc, g:i.g, eif:''};
    return `<span class="alt-opt"><b class="alt-r">UN R${no}${nn?'.'+nn:''}</b>${rm.s?`<span class="alt-cn">${rm.s}</span>`:''}${reachBadge(si)}${verCell(si)}</span>`;
  });
  return `<span class="alt-tag" title="两条法规对该固定点等效，取得任一批准即可，无需两条都做">二选一等效</span>${opts.join('<span class="alt-sep">或</span>')}`;
}
// 全量展开后的条目总数（捆绑项按 subItemsOf 拆成多条叶子法规）——凡是要与 applicable()
// 的展开结果做"总数"对比，都必须用这个而非 ITEMS.length（后者是未展开的合并项数，
// 会小于展开后的实际条数，导致"适用 X 条（全部 Y 条中）"出现 X > Y 的假象）
function totalExpanded(){ let n=0; ITEMS.forEach(i=>{const s=subItemsOf(i); n+=s?s.length:1;}); return n; }
function applicable(){
  let base;
  // 产品/系统精选优先：用户点选后精确锁定对应法规项。id 命中 PARTS→展开其 items；否则视为原始 item 编码（系统集成商按系统选）
  if(sel.parts&&sel.parts.length){
    const set=new Set(sel.parts.flatMap(id=>{const p=PARTS.find(x=>x.id===id);return p?p.items:[id];}));
    base=ITEMS.filter(i=>set.has(i.item));
  } else {
    // 分类组筛选（不选=全部）+ 角色聚焦：STU=可独立认证条目；售后件=显式独立认证条目
    let gs=sel.groups.length?sel.groups:Object.keys(GROUPS);
    base=ITEMS.filter(i=>gs.includes(i.g));
    if(sel.role==='STU') base=base.filter(i=>i.tc!=='VEHICLE');
    else if(sel.role==='AFTER') base=base.filter(i=>i.tc==='EXPLICIT');
    else if(sel.role==='OEM' && sel.cats && sel.cats.length){
      // 按车型硬收敛：项适用车型与所选车型有交集才保留；车型为空(通用/rollup)始终保留
      base=base.filter(i=>{const cs=ITEM_CATS[i.item]||[]; return !cs.length || cs.some(c=>sel.cats.includes(c));});
    }
  }
  // 捆绑项逐条展开为叶子法规（每条 UN 法规独立成行）
  const out=[];
  base.forEach(i=>{ const subs=subItemsOf(i); if(subs) out.push(...subs); else out.push(i); });
  return out;
}
function focusNote(){
  if(sel.parts&&sel.parts.length) return '';

}

// 软件更新法规项、或系统集成商涉及电子/智能网联(D/E 组)时才相关，否则不该出现
function cyberRelevant(){
  if(sel.role==='OEM') return true;
  if(applicable().some(i=>/R\s?15[56]/i.test(i.reg||''))) return true;
  if(sel.role==='STU' && applicable().some(i=>i.g==='D'||i.g==='E')) return true;
  return false;
}

const EMARK_SRC='来源：以色列 2016 年车辆行业许可法与交通部 אישור דגם 程序 T030315、EU–瑞士 MRA、土耳其 MARTOY（RG 31104）、越南 Decree 60/2023、GSO 2025MY 技术法规清单、印度 AIS-037、东盟 APMRA、新加坡 LTA VITAS、墨西哥 NOM-194-SE-2021（DOF）、阿根廷 Res.15/2019、271/2025 与 18/2026、智利 3CV、乌拉圭 Decreto 81/014、厄瓜多尔 RTE INEN 034(5R)、新西兰 Rule 35001、伊拉克 COSQC ICIGI 与 2024 年第37号迪万令、摩洛哥部令 2730-10、吉尔吉斯 TR CU 018/2011、加纳 GSA 标准与 homologation 公告、埃及 EOS 换证流程、巴基斯坦 EDB/SRO 656(I)/2006、伊朗 INSO/ISIRI 等官方文件。本表所列采信均为各国国内法或区域协定框架下的采纳（含 1958 协定之外的区域安排，如东盟 APMRA），不等于 E 证被自动接受；采信程度分为「仅以 UN 法规为立法蓝本」「承认 UN 型批或指定机构测试报告」「须本国机构重新测试」三档，逐国不同。信息时点截至 2026-07，法规版本、生效日与实际执行力度（含延期实施、证书效力暂停）均可能变动，报价与项目决策前须向各国主管机关或指定认证机构书面复核。';
// 接受欧盟整车型式批准(WVTA)的地区：欧盟 27 + EEA(挪威/冰岛/列支敦士登)；英国脱欧后为 GB 体系，单列「需转换」
const EU_EEA=['德国','法国','意大利','荷兰','比利时','卢森堡','爱尔兰','丹麦','希腊','西班牙','葡萄牙','奥地利','瑞典','芬兰','波兰','匈牙利','捷克','斯洛伐克','斯洛文尼亚','克罗地亚','罗马尼亚','保加利亚','立陶宛','拉脱维亚','爱沙尼亚','塞浦路斯','马耳他','挪威','冰岛','列支敦士登','英国'];
// 提取「Germany 德国」中的中文国名
function _cnName(s){ s=(s||'').trim(); const m=s.match(/[一-鿿][一-鿿·（）]*$/); return m?m[0]:s; }
// 可通行国家名单数据（按角色切口径）。铁律：名单行必须与当前选品的认证路径一致——
// 无大 E 法规时不得出现任何「基于 UN / ECE」口径的行（采信/参照全部以 ECE 证书为前提）。
function reachData(){
  const oem = sel.role==='OEM';
  const rows=[];
  // 欧盟/EEA 行；英国单列：脱欧后实行 GB 型式批准，欧盟批准不再直接有效
  const pushEU=(tagT,noteEU)=>EU_EEA.forEach(cn=>{
    if(cn==='英国'){ rows.push({cn,tag:'ref',tagT:'参照 / 需转换',note:'脱欧后实行 GB 型式批准，欧盟批准需按 GB 方案转换或另行申请'}); return; }
    rows.push({cn,tag:'eu',tagT,note:['挪威','冰岛','列支敦士登'].includes(cn)?'EEA，采纳欧盟型批':noteEU});
  });
  if(oem){
    pushEU('接受欧盟 WVTA','欧盟成员，欧盟 WVTA 本土有效');
    EMARK_ACCEPT.accepts.forEach(([cn,note])=>rows.push({cn,tag:'ok',tagT:'采信整车型批',note}));
    EMARK_ACCEPT.refs.forEach(([cn,note])=>rows.push({cn,tag:'ref',tagT:'参照 / 部分采信',note}));
    return {oem,rows};
  }
  // 零部件/系统：applicable 大 E 法规的 1958 缔约方（强制互认），逐国统计覆盖法规数
  const items=applicable(); const nos=new Set();
  items.forEach(i=>regTokens(i.reg).forEach(k=>{const m=/^UN R(\d{1,3}(?:-H)?)$/.exec(k);if(m)nos.add(m[1]);}));
  const arr=[...nos];
  if(!arr.length){
    // 选品全部为小 e（仅 EU 法规，无对应 UN 法规）→ 无 ECE 证书可采信，1958 互认与采信/参照路径整体不适用
    pushEU('接受 EU 型批','欧盟成员，EU 型式批准直接有效');
    return {oem,rows,eOnly:true};
  }
  const cty={};
  arr.forEach(no=>{const reg=(typeof VERDB!=='undefined'&&VERDB)?(VERDB.byNo[no]||VERDB.byNo[no.replace(/-/g,'')]):null; if(!reg||!reg.parties)return;
    reg.parties.forEach(pp=>{const cn=_cnName(pp.country); if(!cn)return; (cty[cn]||(cty[cn]=new Set())).add(no);});});
  Object.keys(cty).sort((a,b)=>cty[b].size-cty[a].size).forEach(cn=>rows.push({cn,tag:'party',tagT:'强制互认',note:`适用您 ${cty[cn].size}/${arr.length} 项大 E 法规`}));
  // 零部件口径只列 refs（部件层面参照/采信）；accepts 均为整车级采信、只进整车名单。
  // 已以缔约方身份在列的国家（新西兰等）不再重复列入。
  const partySet=new Set(Object.keys(cty));
  EMARK_ACCEPT.refs.forEach(([cn,note])=>{ if(!partySet.has(cn)) rows.push({cn,tag:'ref',tagT:'参照',note}); });
  // 自有·不直接采信（中国/巴西等）不进可通行名单（业主指示）
  return {oem,rows};
}

// 某项是否「纯独立部件」（其全部 UN R 均为 component）→ 归售后件，不进系统集成商
function itemComponentOnly(i){
  const nos=(regTokens(i.reg)||[]).map(k=>k.replace(/^UN R/,''));
  if(!nos.length) return false;
  return nos.every(n=>REG_APPTYPE[n]==='component');

function regSearch(v){
  _regSearchQ=v||'';
  const q=(v||'').trim().toLowerCase().replace(/\s+/g,'');
  const cnt=document.getElementById('regsearch-cnt');
  const tiles=document.querySelectorAll('.stile[data-search]');
  const rows=document.querySelectorAll('.arow[data-search]');
  const ghs=document.querySelectorAll('.arow-gh');
  if(!q){
    tiles.forEach(t=>t.classList.remove('dim','hit'));
    rows.forEach(r=>{r.classList.remove('hit');r.style.display='';});
    ghs.forEach(g=>{g.style.display='';});
    if(cnt) cnt.textContent='';
    return;
  }
  const test=el=>(el.dataset.search||'').replace(/\s+/g,'').includes(q);
  let n=0;
  tiles.forEach(t=>{const m=test(t); t.classList.toggle('hit',m); t.classList.toggle('dim',!m);});
  // 明细行：匹配才显示，其余隐藏
  rows.forEach(r=>{const m=test(r); if(m)n++; r.classList.toggle('hit',m); r.style.display=m?'':'none';});
  // 分组标题：仅当本组（其后连续的拆分子行 .arow-sub）内有可见匹配行才显示；遇到独立行即本组结束
  ghs.forEach(g=>{
    let has=false,el=g.nextElementSibling;
    while(el&&!el.classList.contains('arow-gh')){
      if(el.classList.contains('arow-sub')){ if(el.style.display!=='none'){has=true;break;} }
      else if(el.classList.contains('arow')){ break; }
      el=el.nextElementSibling;
    }
    g.style.display=has?'':'none';
  });
  if(cnt) cnt.textContent=n?`${n} 条匹配`:'无匹配';
}

function computeScores(){
  const items=applicable();
  // X 轴 · 法规完成度（权重见 CONFIG.weights.reg；默认 done=1 / prog=0.5，与验证行为一致）
  const rw=CONFIG.weights.reg;
  let x=0;
  items.forEach(i=>{ const w=rw[regStatus[i.item]]; x += (typeof w==='number'?w:0); });
  const X=items.length? Math.round(x/items.length*100):0;
  // Y 轴 · 体系成熟度：维度分 = 该维题目均分（有=1/部分=0.5/无=0），再按 sysWeight 加权
  //（默认等权 + 每题同分时与原 4 粗题行为一致，评分语义未变）
  const sw=CONFIG.weights.sysScore, ww=CONFIG.weights.sysWeight;
  let y=0, wsum=0;
  activeSys().forEach(s=>{
    const w=(typeof ww[s.id]==='number'?ww[s.id]:1); wsum+=w;
    const m=s.qs.reduce((a,q)=>{const sc=sw[sysStatus[q.id]];return a+(typeof sc==='number'?sc:0);},0)/s.qs.length;
    y+=m*w;
  });
  const Y=wsum? Math.round(y/wsum*100):0;
  return {X,Y,items};
}
function dimScore(s){ // 单维度 0-100（矩阵明细表用）
  const sw=CONFIG.weights.sysScore;
  const m=s.qs.reduce((a,q)=>{const sc=sw[sysStatus[q.id]];return a+(typeof sc==='number'?sc:0);},0)/s.qs.length;
  return Math.round(m*100);
}
function quadrant(X,Y){
  const T=CONFIG.threshold;
  if(X>=T&&Y>=T)return{key:'ready',name:'成熟',color:'#1F7A4D',desc:'法规满足、体系健全',svc:'版本追踪订阅，保持领先'};
  if(X>=T&&Y<T)return{key:'fragile',name:'待加固',color:'#C0392B',desc:'拿了证但缺体系——证书面临失效风险',svc:'CoP 托管 + 体系建设（最紧迫）'};
  if(X<T&&Y>=T)return{key:'start',name:'完善中',color:'#2563EB',desc:'有体系但法规未做全',svc:'认证代办，补齐缺的条数'};
  return{key:'naked',name:'初始',color:'#6B7280',desc:'新进入者，尚未起步',svc:'全流程托管 / 入门培训'};
}

function actionPlanHTML(st){
  if(st.id==='scope'){
    const items=applicable();
    return `<div class="ap-done">✓ 已根据您的角色 / 产品 / 车型自动识别 <b>${items.length}</b> 项适用法规，逐条清单见「③ 法规盘点」。</div>`;
  }
  if(st.id==='authority'){
    const ok=profile.authority&&profile.authority!=='undecided';
    return ok?`<div class="ap-done">✓ 已选定意向批准机关：<b>${plabel('authority')}</b>，可据此直接对接。</div>`
             :`<div class="ap-block"><div class="ap-h">行动计划（按①企业画像自动生成）</div><div class="ap-row"><span class="ap-dot" style="background:${STAT_COL.no.bg}"></span>尚未选定批准机关<span class="ap-act">→ 请回到「① 企业画像」选定</span></div></div>`;
  }
  if(st.dim){
    const sys=SYS.find(x=>x.id===st.dim);
    const todo=sys.qs.filter(q=>sysStatus[q.id]!=='full');
    if(!todo.length) return `<div class="ap-done">✓「${sys.name}」体系自评全部已建立，本站暂无待办事项。</div>`;
    const rows=todo.map(q=>{const v=sysStatus[q.id]||'none';const c=v==='part'?STAT_COL.prog.bg:STAT_COL.no.bg;const label=v==='part'?'需补全':'需建立';
      return `<div class="ap-row"><span class="ap-dot" style="background:${c}"></span>${q.q}<span class="ap-act">→ ${label}</span></div>`;}).join('');
    return `<div class="ap-block"><div class="ap-h">行动计划（按④体系自评「${sys.name}」自动生成，${sys.qs.length-todo.length}/${sys.qs.length} 已建立）</div>${rows}</div>`;
  }
  if(st.reg){
    // 委托技术服务机构/送样测试/递交申请三站共用同一个 regStatus 字段——数据上无法区分某条法规
    // 具体卡在哪个环节，因此不在三站重复逐条铺陈同一份清单（此前的写法曾被反馈"看起来很同质化、
    // 信息串太长"），改为一行状态统计 + 跳转到③法规盘点查看逐条明细，避免与③页重复铺陈。
    const items=applicable();
    const todo=items.filter(i=>regStatus[i.item]!=='done');
    if(!todo.length) return `<div class="ap-done">✓ 适用的 <b>${items.length}</b> 项法规均已认证，本站暂无待办事项。</div>`;
    let progN=0,noN=0,unkN=0;
    todo.forEach(i=>{const s=regStatus[i.item]||'unk';if(s==='prog')progN++;else if(s==='no')noN++;else unkN++;});
    const parts=[];
    if(noN) parts.push(`<b style="color:${STAT_COL.no.bg}">${noN}</b> 项未开始`);
    if(unkN) parts.push(`<b style="color:${STAT_COL.unk.bg}">${unkN}</b> 项状态不清楚`);
    if(progN) parts.push(`<b style="color:${STAT_COL.prog.bg}">${progN}</b> 项进行中`);
    return `<div class="ap-block"><div class="ap-h">行动计划（按③法规盘点自动生成，${items.length-todo.length}/${items.length} 已认证）</div>
      <div class="ap-sum">还有 ${parts.join(' · ')} 待处理。</div>
      <button class="tp-link" onclick="go(3)">→ 查看逐条清单（③ 法规盘点）</button></div>`;
  }
  return '';
}

 {q:'证书上的 E4、E1 数字是什么意思？标志外框有讲究吗？',a:'数字是签发批准的缔约方<b>国别代号</b>（E1=德国、E4=荷兰、E8=捷克、E11=英国、E13=卢森堡、E50=马耳他…），由您选择的批准机关决定，与产品销往哪国无关。外框有讲究：<b>圆形外框＝UNECE 大 E</b>，<b>长方形外框＝EU 小 e</b>——看外框即知认证路线（示意图见「标志速查」）。证书在共同适用该法规的缔约方间互认。'},

 {q:'整车层面能拿大 E（UN 整车批准）吗？',a:'能——<b>UN R0 IWVTA</b>（1958 协定的国际整车型式批准）就是整车的「大 E 体系」批准，但有三个限制：① 仅限 <b>M1 乘用车</b>量产完成车（R0 ¶1.1），卡车/客车/挂车/多阶段不覆盖；② 分 <b>U-IWVTA</b>（43 项 UN 法规全满足，适用 R0 的缔约方须接受）与 <b>L-IWVTA</b>（部分满足，认可有限）；③ IWVTA 只覆盖安全类 UN 法规，<b>不含排放、CO₂、质量尺寸</b>等——进欧盟市场整车证仍是 EU-WVTA（e 证），U-IWVTA 在其中作为 UN 法规部分的证据被接受。整车 IWVTA 也要贴标——注意<b>不是单独的「U 圈」</b>：外框仍是圆形 E+国别号，字母 U/L 出现在批准号里（如 <b>0R00U-1234/01</b>：0＝R0/00＝系列/U＝universal/1234＝class/01＝type，字高 ≥8mm，R0 ¶4.5-4.9 + Annex 2）；IWVTA 引用的车辆系统免贴标，部件仍按各自 UN 法规打标（¶4.7）。所以整车层面实为三者并存：<b>R0 IWVTA（U）/ EU-WVTA（e）/ 部件大 E</b>。43 项必备清单见法规盘点页「IWVTA」按钮，标志样式见「标志速查」示意。'},

// ===== 成熟度雷达图（X 法规完成度 + 各体系维度）=====
function radarSVG(size){
  const {X}=computeScores();
  const axes=[{n:'法规完成度',v:X}].concat(activeSys().map(s=>({n:s.name.replace(/体系|机制|管理$/g,'').slice(0,7),v:dimScore(s)})));
  const N=axes.length, R=(size||220)/2-34, cx=(size||220)/2, cy=(size||220)/2+4;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const ring=f=>axes.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ');
  const poly=axes.map((ax,i)=>pt(i,R*ax.v/100).map(v=>v.toFixed(1)).join(',')).join(' ');
  const labels=axes.map((ax,i)=>{const [x,y]=pt(i,R+16);const anch=Math.abs(x-cx)<8?'middle':(x>cx?'start':'end');
    return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" font-size="10.5" fill="#6B7280" text-anchor="${anch}">${ax.n} ${ax.v}</text>`;}).join('');
  const spokes=axes.map((_,i)=>{const [x,y]=pt(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#ECEEF1"/>`;}).join('');
  return `<svg viewBox="0 0 ${size||220} ${size||220}" width="100%" style="max-width:${size||220}px" aria-label="成熟度雷达图">
    ${[0.25,0.5,0.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="#ECEEF1"/>`).join('')}${spokes}
    <polygon points="${poly}" fill="rgba(232,98,44,.18)" stroke="#E8622C" stroke-width="1.8" stroke-linejoin="round"/>
    ${axes.map((ax,i)=>{const [x,y]=pt(i,R*ax.v/100);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#E8622C"/>`;}).join('')}${labels}</svg>`;
}
// 每一站的现状：从画像 + 法规盘点 + 体系自评推导
function journeyStatus(){
  const {items}=computeScores();
  let done=0,prog=0;
  items.forEach(i=>{const s=regStatus[i.item];if(s==='done')done++;else if(s==='prog')prog++;});
  const total=items.length;
  const regDone=total>0&&done===total, regSome=done>0||prog>0;
  const copSc=dimScore(SYS.find(x=>x.id==='cop'));
  return STAGES.map(st=>{
    let state='todo', note='';
    if(st.id==='scope'){state='done';note=`已识别 ${total} 项适用法规`;}
    else if(st.id==='authority'){const ok=profile.authority&&profile.authority!=='undecided';state=ok?'done':'todo';note=ok?'已选定 '+plabel('authority'):'尚未选定批准机关';}
    else if(st.dim){const sc=dimScore(SYS.find(x=>x.id===st.dim));state=sc>=100?'done':(sc>0?'prog':'todo');note={done:'体系已建立',prog:'体系部分建立',todo:'体系尚缺'}[state];
      if(st.id==='cop'&&done>0&&copSc===0){state='gap';note='已有证书但无 CoP 体系——证书面临失效风险';}}
    else if(st.reg){
      if(st.id==='grant'){state=done>0?(regDone?'done':'prog'):'todo';note=`已获 ${done} / ${total} 张证书`;}
      else if(st.id==='ts'){state=regDone?'done':(regSome?'prog':'todo');note=regSome?`已按 ${done+prog} / ${total} 项法规推进委托测试`:'待按适用法规逐项委托认可技术服务机构';}
      else{state=regDone?'done':(regSome?'prog':'todo');note=`${done} 已认证 · ${prog} 进行中 · ${total-done-prog} 未开始`;}
    }
    return Object.assign({},st,{state,note});
  });
}

function computeGaps(items){
  const today=new Date();
  const gapRows=[];
  items.forEach(i=>{
    const s=regStatus[i.item];
    if(s!=='no'&&s!=='unk') return;
    // 法规日历：该 UN R 是否有即将生效的修订 → 倒计时（活数据）
    let due=null;
    const rm=/(?:UN\s*)?R\s*(\d{1,3})\./i.exec(i.reg||'');
    if(rm){ const up=upcomingAmendment(rm[1]); if(up){ const days=Math.ceil((new Date(up.eif)-today)/86400000); if(days>0) due={days,eif:up.eif,status:up.status}; } }
    if(s==='no') gapRows.push({sev:'red',txt:`${i.cn}（${i.reg||'—'}）未开始认证`,svc:'实验室对接+代办',due});
    else gapRows.push({sev:'amber',txt:`${i.cn} 状态不清楚`,svc:'版本追踪订阅',due});
  });
  activeSys().forEach(s=>{
    s.qs.forEach(qq=>{
      const v=sysStatus[qq.id];
      if(v==='none') gapRows.push({sev:'red',txt:`${s.name}：缺少「${qq.q}」`,svc:s.svc});
      else if(v==='part') gapRows.push({sev:'amber',txt:`${s.name}：「${qq.q}」不完整`,svc:'体系补强'});
    });
  });
  // 排序：有生效倒计时的在前（越近越前），其余按 红 > 黄
  gapRows.sort((a,b)=>{
    const da=a.due?a.due.days:1e9, db=b.due?b.due.days:1e9;
    if(da!==db) return da-db;
    return (a.sev==='red'?0:1)-(b.sev==='red'?0:1);
  });
  return gapRows;
}
