<style>
:root{--o:#E8622C;--od:#C44E1E;--ol:#FBE4D7;--ink:#1A1D21;--ink2:#3A3F46;--grey:#6B7280;--greyl:#9AA1AB;--line:#E3E6EA;--bg:#F7F8FA;--card:#FFF;--cream:#FDF6F0;--blue:#2563EB;--purple:#7C3AED;--green:#1F7A4D;--red:#C0392B;--amber:#B45309}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}
.hero{background:linear-gradient(120deg,#fff,#FDF6F0);border-bottom:1px solid var(--line)}
.hi{max-width:1000px;margin:0 auto;padding:40px 24px 36px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.dot{width:26px;height:26px;border-radius:7px;background:var(--o);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.brand b{font-size:15px}.brand span{color:var(--grey);font-size:13px}
h1{font-size:31px;font-weight:800;letter-spacing:-.4px;margin-bottom:8px}
h1 .em{color:var(--o)}
.sub{font-size:15px;color:var(--ink2);max-width:620px;margin-bottom:20px}
.badges{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}
.badge{font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 13px;color:var(--ink2)}
.badge b{color:var(--o)}
.btn{font-family:inherit;font-size:15px;font-weight:700;border:none;border-radius:9px;padding:13px 26px;cursor:pointer;transition:.15s}
.btn-p{background:var(--o);color:#fff;box-shadow:0 2px 10px rgba(232,98,44,.28)}
.btn-p:hover{background:var(--od);transform:translateY(-1px)}
.btn-o{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.rail{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.ri{max-width:1000px;margin:0 auto;padding:14px 24px;display:flex;gap:0}
.rstep{display:flex;align-items:center;font-size:13px;color:var(--greyl);white-space:nowrap}
.rstep .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;margin-right:7px;background:#fff}
.rstep.done .n{background:var(--ol);border-color:var(--o);color:var(--od)}
.rstep.active .n{background:var(--o);border-color:var(--o);color:#fff}
.rstep.active{color:var(--ink);font-weight:700}
.rstep::after{content:"";width:30px;height:1.5px;background:var(--line);margin:0 12px}
.rstep:last-child::after{display:none}
main{padding:34px 0 80px;min-height:60vh}
.step{display:none;animation:fade .3s}
.step.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--o);text-transform:uppercase;margin-bottom:8px}
h2.st{font-size:24px;font-weight:800;margin-bottom:6px}
.lead{color:var(--ink2);font-size:14.5px;margin-bottom:24px;max-width:680px}
.opts{display:grid;gap:12px}
.opts.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.opts.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.opt{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;transition:.15s;text-align:left;font-family:inherit}
.opt:hover{border-color:var(--o);transform:translateY(-1px);box-shadow:0 4px 16px rgba(232,98,44,.1)}
.opt.sel{border-color:var(--o);background:var(--cream)}
.opt .ot{font-size:15px;font-weight:700;margin-bottom:3px}
.opt .od{font-size:12.5px;color:var(--grey)}
.nav{display:flex;justify-content:space-between;margin-top:30px;gap:12px}
.ghost{background:none;border:none;color:var(--grey);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:12px 6px}
.ghost:hover{color:var(--ink)}
/* self-assessment rows */
.secttl{font-size:16px;font-weight:800;margin:22px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--ol);color:var(--od)}
.arow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:8px}
.arow .al{font-size:13.5px}
.arow .al b{font-weight:700}.arow .al small{color:var(--grey);font-size:12px}
.seg{display:flex;gap:0;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font-family:inherit;font-size:12px;font-weight:600;border:none;background:#fff;padding:8px 12px;cursor:pointer;color:var(--grey);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{color:#fff}
.seg button.on.done-b{background:var(--green)}
.seg button.on.prog-b{background:var(--amber)}
.seg button.on.no-b{background:var(--red)}
.seg button.on.unk-b{background:var(--greyl)}
/* result */
.rhd{background:linear-gradient(120deg,var(--ink),#2A2F36);color:#fff;border-radius:16px;padding:28px 30px;margin-bottom:22px}
.rlabel{font-size:12px;letter-spacing:1.5px;color:var(--o);font-weight:700;text-transform:uppercase;margin-bottom:10px}
.rhd h2{font-size:26px;color:#fff;margin-bottom:4px}
.rhd .qname{font-size:15px;color:#C9CDD3}
.scores{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.score .sv{font-size:34px;font-weight:800}
.score .sl{font-size:12px;color:#C9CDD3}
.quad-wrap{display:grid;grid-template-columns:320px 1fr;gap:22px;margin-bottom:24px;align-items:start}
@media(max-width:720px){.quad-wrap{grid-template-columns:1fr}}
.quad{position:relative;width:300px;height:300px;background:#fff;border:1px solid var(--line);border-radius:12px}
.quad .lbl{position:absolute;font-size:11px;font-weight:700;color:var(--greyl)}
.quad .cell{position:absolute;width:50%;height:50%;display:grid;place-items:center;font-size:12px;font-weight:700;opacity:.85}
.marker{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--o);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);transform:translate(-50%,-50%);z-index:5}
.rcard-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:22px}
.rcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.rcard .rk{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--o);text-transform:uppercase;margin-bottom:7px}
.rcard .rv{font-size:14px;line-height:1.5}
.gaplist{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:22px}
.gaphd{background:var(--cream);padding:14px 18px;font-weight:800;font-size:15px;color:var(--od);border-bottom:1px solid var(--ol)}
.gap{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);font-size:13.5px}
.gap:last-child{border-bottom:none}
.gdot{width:10px;height:10px;border-radius:50%}
.gdot.red{background:var(--red)}.gdot.amber{background:var(--amber)}
.gsvc{font-size:12px;font-weight:700;color:var(--o);background:var(--ol);padding:4px 11px;border-radius:12px;white-space:nowrap}
.cta-box{background:linear-gradient(120deg,var(--o),var(--od));color:#fff;border-radius:16px;padding:26px 30px;text-align:center;margin-top:8px}
.cta-box h3{font-size:20px;margin-bottom:6px;color:#fff}
.cta-box p{color:#FCE8DD;font-size:14px;margin-bottom:16px}
.cta-box .btn{background:#fff;color:var(--od)}
.heat{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.hcell{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff}
.foot{text-align:center;color:var(--greyl);font-size:12px;padding:26px 0}
/* live version cell (Step 2) */
.ver{display:block;margin-top:4px;font-size:11.5px}
.ver.load{color:var(--greyl)}
.ver.ok{color:var(--green)}
.ver.ok b{color:var(--od)}
.ver.snap{color:var(--grey)}
.ver.na{color:var(--greyl)}
.verhint{font-size:12px;color:var(--grey);margin:2px 0 10px}
.verhint b{color:var(--o)}
/* disclaimer */
.disclaimer{font-size:12px;color:var(--grey);background:#FBF7F2;border:1px dashed var(--ol);border-radius:9px;padding:11px 15px;margin:18px 0;line-height:1.6}
.disclaimer b{color:var(--od)}
/* accessibility: visible focus ring */
button:focus-visible,.opt:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--o);outline-offset:2px;border-radius:8px}
/* ===== consulting-grade maturity matrix (Step 3) ===== */
.mx-block{display:grid;grid-template-columns:1fr 1fr;background:#15181C;border-radius:14px;overflow:hidden;margin-bottom:18px;border:1px solid #23272E}

.mx-right{padding:22px 24px;color:#E6E9ED;display:flex;flex-direction:column;gap:15px}
.mx-verdict{border-bottom:1px solid #23272E;padding-bottom:13px}
.mx-tag{display:inline-block;font-family:Georgia,serif;font-size:17px;font-weight:700;color:#fff;padding:3px 14px;border-radius:4px;margin-bottom:8px}
.mx-vd{font-size:13px;color:#AEB4BD;line-height:1.5}
.mx-metrics{display:flex;gap:22px;border-bottom:1px solid #23272E;padding-bottom:15px;flex-wrap:wrap}
.mx-metrics>div{display:flex;flex-direction:column}

.mx-recs{margin:0;padding-left:18px;font-size:12.5px;color:#C4CAD2;line-height:1.5}
.mx-recs li{margin-bottom:5px}
.mx-tables{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
@media(max-width:760px){.mx-tables{grid-template-columns:1fr}}
.mx-dt{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mx-dth{font-family:Georgia,serif;font-size:12px;color:var(--ink);font-weight:700;padding:11px 15px;background:#F4F5F7;border-bottom:1px solid var(--line)}

.mx-dt tr.tot td{background:#FBF3EC;font-weight:700;color:var(--ink)}

let VERDB=null, VERSTATE='loading';   // loading | ok | fail
function parseEif(a){
  if(a && a.eif) return a.eif;                                   // 已归一 ISO
  const raw=((a&&a.eif_raw)||'').replace(/[\[\]]/g,'').trim();   // 去掉 [暂定] 括号
  const m=/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/.exec(raw);
  if(!m) return null;
  let y=m[3]; if(y.length===2) y='20'+y;
  return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
}
function buildVerDB(json){
  const byNo={}; (json.regs||[]).forEach(r=>{byNo[String(r.no)]=r;});
  return {byNo, as_of:json.as_of||''};
}
// 按 UN R 编号 + series 匹配，取该 series 下最新 eif
function liveVersion(regStr){
  if(!VERDB) return null;
  const m=/(?:UN\s*)?R\s*(\d{1,3})\.(\d{2})/i.exec(regStr||'');
  if(!m) return null;
  const no=m[1], series=m[2];
  const reg=VERDB.byNo[no];
  if(!reg) return null;
  const re=new RegExp('^(?:'+series+'\\s*series|Suppl\\.?\\s*\\d+\\s*to\\s*'+series+')$','i');
  let best=null;
  (reg.amendments||[]).forEach(a=>{
    if(re.test((a.status||'').trim())){
      const e=parseEif(a);
      if(e && (!best || e>best.eif)) best={status:a.status.trim(), eif:e};
    }
  });
  return best;
}

    }catch(e){/* try next */}
  }
  VERSTATE='fail';
  if(cur===2) render();
}

  const roles=[['OEM','OEM 整车厂','整车 WVTA，需盘点全系统'],['STU','系统集成商','系统作为技术单元认证'],['AFTER','售后件供应商','独立部件/替换件认证']];
  const markets=[['EU','欧盟 (EU)','2018/858 + 2019/2144'],['ECE','1958协定缔约方','E-mark 互认'],['BOTH','两者','大E + 小e 全覆盖']];
  const gopts=Object.entries(GROUPS).map(([k,v])=>`<button class="opt ${sel.groups.includes(k)?'sel':''}" data-grp="${k}"><div class="ot">${k} 组</div><div class="od">${v}</div></button>`).join('');

    <h2 class="st">你的企业与产品范围</h2>

    <div class="secttl">① 你的角色</div>
    <div class="opts g3">${roles.map(r=>`<button class="opt ${sel.role===r[0]?'sel':''}" data-role="${r[0]}"><div class="ot">${r[1]}</div><div class="od">${r[2]}</div></button>`).join('')}</div>
    <div class="secttl">② 目标市场</div>
    <div class="opts g3">${markets.map(m=>`<button class="opt ${sel.market===m[0]?'sel':''}" data-mkt="${m[0]}"><div class="ot">${m[1]}</div><div class="od">${m[2]}</div></button>`).join('')}</div>
    <div class="secttl">③ 涉及的部件分类组（可多选，不选=全部）</div>
    <div class="opts g3">${gopts}</div>
    <div class="nav"><span></span><button class="btn btn-p" onclick="toStep2()">下一步：现状盘点 →</button></div>
  </div>`;
}
function toStep2(){
  if(!sel.role||!sel.market){alert('请先选择角色和目标市场');return;}
  go(2);
}

function verCell(i){
  const v=liveVersion(i.reg);
  if(v) return `<span class="ver ok">现行 <b>${v.status}</b> · 生效 ${v.eif}</span>`;
  if(VERSTATE==='loading') return `<span class="ver load">版本加载中…</span>`;
  return i.eif? `<span class="ver snap">快照 · 生效 ${i.eif}</span>` : `<span class="ver na">现行版本待追踪</span>`;
}
function verBanner(){
  if(VERSTATE==='ok') return `<div class="verhint">已接入 <b>WP.29/343</b> 活数据（截至 ${VERDB.as_of||'—'}）：右上显示各法规<b>现行版本 + 生效日期</b>，随 UNECE 更新自动跟随。勾「不清楚」的项，正是版本追踪订阅的价值所在。</div>`;
  if(VERSTATE==='loading') return `<div class="verhint">正在接入 WP.29/343 活数据以标注现行版本…</div>`;
  return `<div class="verhint">⚠ 活数据暂不可用，已回退到内置生效日期<b>快照</b>（可能非最新，建议开通版本追踪）。</div>`;
}
function step2(){
  const items=applicable();
  // init defaults
  items.forEach(i=>{if(!regStatus[i.item])regStatus[i.item]='unk';});
  SYS.forEach(s=>{if(!sysStatus[s.id])sysStatus[s.id]='none';});
  const rows=items.map(i=>`<div class="arow">
     <div class="al"><b>${i.cn}</b> <small>${i.item} · ${i.reg||'—'}</small>${verCell(i)}</div>
     <div class="seg" data-item="${i.item}">
       <button class="${regStatus[i.item]==='done'?'on done-b':''}" data-v="done">已认证</button>
       <button class="${regStatus[i.item]==='prog'?'on prog-b':''}" data-v="prog">进行中</button>
       <button class="${regStatus[i.item]==='no'?'on no-b':''}" data-v="no">未开始</button>
       <button class="${regStatus[i.item]==='unk'?'on unk-b':''}" data-v="unk">不清楚</button>
     </div></div>`).join('');
  const sysrows=SYS.map(s=>`<div class="arow">
     <div class="al"><b>${s.name}</b> <small>${s.desc}</small></div>
     <div class="seg" data-sys="${s.id}">
       <button class="${sysStatus[s.id]==='full'?'on done-b':''}" data-v="full">已建立</button>
       <button class="${sysStatus[s.id]==='part'?'on prog-b':''}" data-v="part">部分</button>
       <button class="${sysStatus[s.id]==='none'?'on no-b':''}" data-v="none">无</button>
     </div></div>`).join('');
  return `<div class="step on">
    <div class="eyebrow">STEP 2 / 4 · 现状盘点（评估核心）</div>
    <h2 class="st">逐项自评你的合规现状</h2>
    <p class="lead">如实勾选。你填的每一项既算成熟度分，也是我们理解你需求的依据——共 ${items.length} 条法规 + 4 项体系。</p>
    <div class="secttl">X 轴 · 法规完成度（${items.length} 条适用法规）</div>
    ${verBanner()}
    ${rows}
    <div class="secttl">Y 轴 · 体系成熟度（4 项支撑体系）</div>
    ${sysrows}
    <div class="nav"><button class="ghost" onclick="go(1)">← 上一步</button><button class="btn btn-p" onclick="go(3)">生成评估结果 →</button></div>
  </div>`;
}

function computeScores(){
  const items=applicable();
  // X 轴 · 法规完成度（权重见 CONFIG.weights.reg；默认 done=1 / prog=0.5，与验证行为一致）
  const rw=CONFIG.weights.reg;
  let x=0;
  items.forEach(i=>{ const w=rw[regStatus[i.item]]; x += (typeof w==='number'?w:0); });
  const X=items.length? Math.round(x/items.length*100):0;
  // Y 轴 · 体系成熟度（各维度可加权，见 CONFIG.weights.sysWeight；默认等权，与验证行为一致）
  const sw=CONFIG.weights.sysScore, ww=CONFIG.weights.sysWeight;
  let y=0, wsum=0;
  SYS.forEach(s=>{ const w=(typeof ww[s.id]==='number'?ww[s.id]:1); wsum+=w; const sc=sw[sysStatus[s.id]]; y += (typeof sc==='number'?sc:0)*w; });
  const Y=wsum? Math.round(y/wsum*100):0;
  return {X,Y,items};
}
function quadrant(X,Y){
  const T=CONFIG.threshold;
  if(X>=T&&Y>=T)return{key:'ready',name:'就绪',color:'#1F7A4D',desc:'法规满足、体系健全',svc:'版本追踪订阅，保持领先'};
  if(X>=T&&Y<T)return{key:'fragile',name:'脆弱',color:'#C0392B',desc:'拿了证但缺体系——证书面临失效风险',svc:'CoP 托管 + 体系建设（最紧迫）'};
  if(X<T&&Y>=T)return{key:'start',name:'起步',color:'#2563EB',desc:'有体系但法规未做全',svc:'认证代办，补齐缺的条数'};
  return{key:'naked',name:'裸奔',color:'#6B7280',desc:'新进入者，尚未起步',svc:'全流程托管 / 入门培训'};
}

  const {X,Y,items}=computeScores();

  // X 轴明细
  let done=0,prog=0,nostart=0,unk=0;

  const donePct=total?Math.round(done/total*100):0;
  // Y 轴明细（每维度 有=100/部分=50/无=0）

      <defs><pattern id="mxg" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0 L0 0 0 34" fill="none" stroke="#2A2F38" stroke-width="0.5"/></pattern></defs>
      <rect x="60" y="20" width="340" height="340" fill="url(#mxg)"/>
      <rect x="60" y="20" width="170" height="170" fill="#2563EB" opacity="0.05"/>
      <rect x="230" y="20" width="170" height="170" fill="#1F7A4D" opacity="0.06"/>
      <rect x="60" y="190" width="170" height="170" fill="#6B7280" opacity="0.05"/>
      <rect x="230" y="190" width="170" height="170" fill="#C0392B" opacity="0.06"/>
      <line x1="230" y1="20" x2="230" y2="360" stroke="#3A414B" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="60" y1="190" x2="400" y2="190" stroke="#3A414B" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="60" y1="360" x2="400" y2="360" stroke="#5A6270" stroke-width="1.2"/>
      <line x1="60" y1="20" x2="60" y2="360" stroke="#5A6270" stroke-width="1.2"/>
      <text x="60" y="378" fill="#8A93A0" font-size="10" text-anchor="middle">0</text>
      <text x="230" y="378" fill="#8A93A0" font-size="10" text-anchor="middle">50</text>
      <text x="400" y="378" fill="#8A93A0" font-size="10" text-anchor="middle">100</text>
      <text x="52" y="364" fill="#8A93A0" font-size="10" text-anchor="end">0</text>
      <text x="52" y="194" fill="#8A93A0" font-size="10" text-anchor="end">50</text>
      <text x="52" y="24" fill="#8A93A0" font-size="10" text-anchor="end">100</text>
      <text x="145" y="54" fill="#2563EB" font-size="15" text-anchor="middle" font-style="italic" font-family="Georgia,serif">起步</text>
      <text x="145" y="72" fill="#6B7280" font-size="8.5" text-anchor="middle">有体系 · 法规未全</text>
      <text x="315" y="54" fill="#1F7A4D" font-size="15" text-anchor="middle" font-style="italic" font-family="Georgia,serif">就绪</text>
      <text x="315" y="72" fill="#6B7280" font-size="8.5" text-anchor="middle">法规满足 · 体系健全</text>
      <text x="145" y="332" fill="#8A93A0" font-size="15" text-anchor="middle" font-style="italic" font-family="Georgia,serif">裸奔</text>
      <text x="145" y="350" fill="#6B7280" font-size="8.5" text-anchor="middle">双缺 · 尚未起步</text>
      <text x="315" y="332" fill="#C0392B" font-size="15" text-anchor="middle" font-style="italic" font-family="Georgia,serif">脆弱</text>
      <text x="315" y="350" fill="#6B7280" font-size="8.5" text-anchor="middle">有证 · 无体系</text>
      <text x="230" y="405" fill="#C9CFD8" font-size="11" text-anchor="middle">X · 法规完成度 →</text>
      <text x="18" y="190" fill="#C9CFD8" font-size="11" text-anchor="middle" transform="rotate(-90 18 190)">Y · 体系成熟度 →</text>
      <circle cx="257.2" cy="217.2" r="5" fill="none" stroke="#8A93A0" stroke-width="1.5" stroke-dasharray="2 2"/>
      <text x="266" y="220" fill="#8A93A0" font-size="8.5">行业典型</text>
      <line x1="${cx}" y1="${cy}" x2="${cx}" y2="360" stroke="#E8622C" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.6"/>
      <line x1="${cx}" y1="${cy}" x2="60" y2="${cy}" stroke="#E8622C" stroke-width="0.7" stroke-dasharray="2 2" opacity="0.6"/>
      <circle cx="${cx}" cy="${cy}" r="8" fill="${q.color}" stroke="#fff" stroke-width="2.5"/>
      <text x="${cx}" y="${labY}" fill="#E6E9ED" font-size="10.5" text-anchor="middle" font-weight="bold">你 (${X}, ${Y})</text>
    </svg>`;
  const recsHTML=copy.recs.map(r=>`<li>${r}</li>`).join('');
  return `<div class="step on">
    <div class="eyebrow">STEP 3 / 4 · 成熟度评分</div>
    <h2 class="st">合规成熟度定位</h2>
    <p class="lead">基于 ${total} 条适用法规自评与 ${SYS.length} 项体系自评，双轴模型将你的企业定位于下列矩阵——定位点随自评实时移动。</p>
    <div class="mx-block">
      <div class="mx-left">
        <div class="mx-eyebrow">COMPLIANCE MATURITY MATRIX</div>
        ${svg}
      </div>
      <div class="mx-right">
        <div class="mx-verdict"><span class="mx-tag" style="background:${q.color}">${q.name}象限</span><div class="mx-vd">${q.desc}</div></div>
        <div class="mx-metrics">
          <div><span class="mm-v" style="color:#60A5FA">${X}</span><span class="mm-l">法规完成度</span></div>
          <div><span class="mm-v" style="color:#A78BFA">${Y}</span><span class="mm-l">体系成熟度</span></div>
          <div><span class="mm-v" style="color:#E8935A">${gaps}</span><span class="mm-l">待处理缺口</span></div>
        </div>
        <div class="mx-ip">
          <div class="mx-iph">风险研判</div>
          <p class="mx-risk">${copy.risk}</p>
          <div class="mx-iph">优先建议</div>
          <ol class="mx-recs">${recsHTML}</ol>
        </div>
      </div>
    </div>
    <div class="mx-tables">
      <div class="mx-dt"><div class="mx-dth">法规完成度明细 · X 轴</div><table>
        <tr><td>已认证</td><td class="r"><b>${done}</b></td><td class="r g">${donePct}%</td></tr>
        <tr><td>进行中</td><td class="r"><b>${prog}</b></td><td class="r g">计半分</td></tr>
        <tr><td>未开始 / 不清楚</td><td class="r"><b>${gaps}</b></td><td class="r rd">缺口</td></tr>
        <tr class="tot"><td>适用法规总数</td><td class="r"><b>${total}</b></td><td class="r">X=${X}</td></tr></table></div>
      <div class="mx-dt"><div class="mx-dth">体系成熟度明细 · Y 轴</div><table>
        ${sysDetail.map(d=>`<tr><td>${d.name}</td><td class="r"><b>${d.sc}</b></td><td class="r g">${d.lab}</td></tr>`).join('')}
        <tr class="tot"><td>${SYS.length} 维加权</td><td></td><td class="r">Y=${Y}</td></tr></table></div>
    </div>

    <div class="nav"><button class="ghost" onclick="go(2)">← 修改自评</button><button class="btn btn-p" onclick="go(4)">查看实施路线图 →</button></div>
  </div>`;
}

function step4(){
  const {X,Y,items}=computeScores();
  const q=quadrant(X,Y);
  // gap -> service mapping
  const gapRows=[];
  items.forEach(i=>{
    const s=regStatus[i.item];
    if(s==='no') gapRows.push({sev:'red',txt:`${i.cn}（${i.reg||'—'}）未开始认证`,svc:'实验室对接+代办'});
    else if(s==='unk') gapRows.push({sev:'amber',txt:`${i.cn} 状态不清楚`,svc:'版本追踪订阅'});
  });
  SYS.forEach(s=>{
    if(sysStatus[s.id]==='none'){
      const svc=s.id==='cop'?'CoP 年度托管':(s.id==='cyber'?'R155/R156 体系建设':(s.id==='doc'?'技术文档编制':'版本追踪订阅'));
      gapRows.push({sev:'red',txt:`缺少「${s.name}」`,svc});
    }else if(sysStatus[s.id]==='part'){
      gapRows.push({sev:'amber',txt:`${s.name} 不完整`,svc:'体系补强'});
    }
  });
  const shown=gapRows.slice(0,12);
  const gapHTML=shown.map(g=>`<div class="gap"><span class="gdot ${g.sev}"></span><span>${g.txt}</span><span class="gsvc">${g.svc}</span></div>`).join('') || '<div class="gap"><span>暂无明显缺口，恭喜！</span></div>';
  return `<div class="step on">
    <div class="eyebrow">STEP 4 / 4 · 实施路线图</div>
    <h2 class="st">你的合规待办清单</h2>
    <p class="lead">下列每一项缺口都对应一项可落地的服务。共识别 ${gapRows.length} 项，展示前 ${shown.length} 项。</p>
    <div class="gaplist">
      <div class="gaphd">📋 缺口 → 服务映射</div>
      ${gapHTML}
    </div>
    <div class="rcard-g">
      <div class="rcard"><div class="rk">象限策略</div><div class="rv"><b style="color:${q.color}">${q.name}</b> — ${q.svc}</div></div>
      <div class="rcard"><div class="rk">成熟度定位</div><div class="rv">X ${X} / Y ${Y} · ${gapRows.length} 项缺口</div></div>
    </div>
    <p class="disclaimer"><b>免责声明：</b>本评估为初步合规导航，不构成正式合规意见，最终以认可技术服务机构 / 型式批准机关为准。生效日期以 UNECE WP.29 官方公报及主管型式批准机关最新版本为准。</p>
    <div class="cta-box">
      <h3>你的免费评估报告已生成</h3>
      <p>报告已列出全部 ${gapRows.length} 项缺口。想知道「每一项具体怎么补、优先做哪个」？<br>预约我们的专家，一对一为你解读。</p>
      <button class="btn" onclick="alert('（示意）已记录：企业定位『'+'${q.name}象限'+'』· ${gapRows.length}项缺口 · 将转销售预约专家解读')">预约专家解读我的缺口 →</button>
    </div>
    <div class="nav"><button class="ghost" onclick="go(3)">← 返回评分</button><button class="ghost" onclick="restart()">↻ 重新评估</button></div>
  </div>`;
}
function restart(){sel={role:null,market:null,groups:[]};regStatus={};sysStatus={};go(0);}

function bind(){
  document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{sel.role=b.dataset.role;render();});
  document.querySelectorAll('[data-mkt]').forEach(b=>b.onclick=()=>{sel.market=b.dataset.mkt;render();});
  document.querySelectorAll('[data-grp]').forEach(b=>b.onclick=()=>{const g=b.dataset.grp;const i=sel.groups.indexOf(g);if(i>=0)sel.groups.splice(i,1);else sel.groups.push(g);render();});
  document.querySelectorAll('.seg[data-item]').forEach(seg=>{seg.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{regStatus[seg.dataset.item]=btn.dataset.v;render();});});
  document.querySelectorAll('.seg[data-sys]').forEach(seg=>{seg.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{sysStatus[seg.dataset.sys]=btn.dataset.v;render();});});
}
render();
loadVerDB();   // Task 2 · 后台拉取活数据（现行版本/生效日期），完成后若在 Step2 自动重渲染
</script>
