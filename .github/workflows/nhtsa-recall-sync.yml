name: NHTSA recalls → recalls (weekly)

# 定期把美国 NHTSA(国家公路交通安全管理局)机动车安全召回同步进 Supabase recalls 表,
# 16 召回案例页会自动显示新记录。NHTSA 车辆召回号 YYV### 连续递增,脚本从库里已有最大号
# 附近向后逐号探测官方 API,连续空号即停,同时回填中间缺号。每周跑两次(周二、周五)。
# 也可在 Actions 页手动触发(workflow_dispatch)。
# 无需任何 Secret:Supabase url + anonKey 从仓库根 config.js 解析(anonKey 本就公开,RLS 全放行)。

on:
  schedule:
    - cron: "42 6 * * 2,5"   # 每周二、周五 06:42 UTC
  workflow_dispatch:
    inputs:
      year:
        description: "年份前缀两位(留空=当前年)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nhtsa-recall-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync NHTSA vehicle safety recalls
        run: |
          if [ -n "${{ github.event.inputs.year }}" ]; then
            python tools/nhtsa_recall_sync.py --year "${{ github.event.inputs.year }}"
          else
            python tools/nhtsa_recall_sync.py
          fi
