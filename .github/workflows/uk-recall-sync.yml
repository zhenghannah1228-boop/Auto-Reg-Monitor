name: UK DVSA recalls → recalls (weekly)

# 定期把英国 DVSA(驾驶与车辆标准局)机动车安全召回同步进 Supabase recalls 表,
# 16 召回案例页会自动显示新记录。GOV.UK 查询服务无批量/API,但页面服务端渲染,
# 脚本用纯 stdlib 遍历 品牌→车型→/recalls(年份可跳),按召回编号 R/YYYY/NNN 去重。
# 默认精选主流 OEM+中国品牌、仅近两年;每周日跑一次。也可手动触发(workflow_dispatch)。
# 无需任何 Secret:Supabase url + anonKey 从仓库根 config.js 解析(anonKey 本就公开,RLS 全放行)。

on:
  schedule:
    - cron: "48 6 * * 0"   # 每周日 06:48 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "遍历全部品牌(true=全量;留空=精选)"
        required: false
        default: ""
      min_year:
        description: "仅收召回编号年份≥此值(留空=当前年-1)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: uk-recall-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync UK DVSA vehicle recalls
        run: |
          ARGS=""
          [ "${{ github.event.inputs.full }}" = "true" ] && ARGS="$ARGS --full"
          [ -n "${{ github.event.inputs.min_year }}" ] && ARGS="$ARGS --min-year ${{ github.event.inputs.min_year }}"
          python tools/uk_recall_sync.py $ARGS
