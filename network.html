<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法规关系网络图 · ECharts 清晰版</title>
<script src="./echarts.min.js"></script>
<script src="./xlsx.full.min.js"></script>
<script src="./config.js"></script>
<style>
:root{--ink:#1a2420;--paper:#f5f3ef;--panel:#fcfbf6;--line:#ddd6c6;--accent:#c6502a;--muted:#8d8674;
  --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Inter','Segoe UI',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);padding:14px 18px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar h1{font-size:16px;font-weight:800;margin-right:8px}
.bar h1 a{color:var(--muted);text-decoration:none;font-size:12px;font-weight:400}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{font-family:var(--mono);font-size:11px;padding:7px 14px;border:none;background:transparent;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--paper);font-weight:600}
.btn{font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:var(--panel);
  padding:7px 13px;border-radius:6px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.hint{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
#chart{width:100%;height:calc(100vh - 120px);min-height:520px;background:var(--paper);
  border:1px solid var(--line);border-radius:8px}
#status{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
input[type=file]{display:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:var(--paper);font-size:12px;padding:10px 20px;border-radius:8px;opacity:0;transition:.3s;
  font-family:var(--mono);pointer-events:none;z-index:9}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="bar">
  <h1>法规关系网络 · 清晰版 <a href="./index.html">← 返回监控台</a></h1>
  <div class="seg">
    <button id="m-cross" class="on" onclick="setMode('cross')">跨国联动</button>
    <button id="m-belong" onclick="setMode('belongs')">单国内部</button>
  </div>
  <button class="btn" onclick="document.getElementById('up').click()">⊕ 上传国家清单 Excel(可多选)</button>
  <input type="file" id="up" multiple accept=".xlsx,.xls,.xlsb,.csv">
  <button class="btn" onclick="restoreOverview()">⟲ 返回概览</button>
  <button class="btn" onclick="loadDemo()">演示数据</button>
  <span class="hint">拖拽 · 滚轮缩放 · 点击看关联 · 点国家/领域气泡下钻明细 · 点空白返回概览</span>
</div>
<div id="chart"></div>
<div id="status"><span id="st-data">—</span><span id="st-view">—</span></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
 * 第一部分:数据解析管线(纯函数,与渲染分离)
 *   parseWorkbook(file) → rows[]      —— Excel → 标准化行
 *   rowsToGraph(rows)   → {detail, overview} —— 行 → 两级图数据
 * 新国家清单只要符合 25 列 schema(表头在前 6 行内,列顺序任意),
 * 上传即自动并入,无需改代码。
 * ===================================================================== */

/* ---- 可扩展常量:国家别名映射(新增别名只改这里) ---- */
const COUNTRY_ALIAS={
  "UN ECE":"UNECE","GTR(全球技术法规)":"GTR","GTR(全球技术法规)":"GTR",
  "南方共同市场(MERCOSUR)":"南方共同市场","南方共同市场(MERCOSUR)":"南方共同市场",
  "东非共同体(EAC)":"东非共同体","东非共同体(EAC)":"东非共同体",
  "非洲(ARSO 区域)":"ARSO","非洲(ARSO区域)":"ARSO","非洲(ARSO 区域)":"ARSO",
};
function normCountry(s){
  s=String(s||"").trim();
  if(COUNTRY_ALIAS[s])return COUNTRY_ALIAS[s];
  // 「中文名 English」→ 中文名
  const m=s.match(/^([一-鿿·()()/]+)\s+[A-Za-z]/);
  if(m)s=m[1].trim();
  return COUNTRY_ALIAS[s]||s;
}

/* ---- 可扩展常量:法规领域归一(按顺序匹配,命中即止)+ 颜色 ---- */
const DOMAIN_RULES=[
  {name:"节能环保",   test:s=>/环保|节能|排放/.test(s),                          color:"#27ae60"},
  {name:"安全",       test:s=>/安全/.test(s),                                    color:"#c0392b"},
  {name:"电动汽车/电池",test:s=>/电动|电池/.test(s),                              color:"#2980b9"},
  {name:"照明",       test:s=>/照明/.test(s),                                    color:"#f39c12"},
  {name:"标识要求",   test:s=>/标识|标签/.test(s),                               color:"#8e44ad"},
  {name:"入关/关税",  test:s=>/入关|关税|海关/.test(s),                          color:"#16a085"},
  {name:"智能网联/自动驾驶",test:s=>/智能网联|自动驾驶|ADAS|网络安全|信息化/i.test(s),color:"#9b59b6"},
  {name:"汽车电子/射频",test:s=>/电子|射频/.test(s),                              color:"#1abc9c"},
  {name:"注册上牌",   test:s=>/上牌|注册/.test(s),                               color:"#7f8c8d"},
];
const DOMAIN_OTHER={name:"其他",color:"#bdc3c7"};
function normDomain(s){
  s=String(s||"").trim();
  if(s){
    // 「安全」规则要求不含环保/节能 —— 由"节能环保排第一"自然保证
    for(const r of DOMAIN_RULES)if(r.test(s))return r;
  }
  return DOMAIN_OTHER;
}
const DOMAIN_CATS=[...DOMAIN_RULES.map(r=>({name:r.name,color:r.color})),DOMAIN_OTHER];

/* ---- 占位符识别:这些值视为"无引用",不生成跨国边 ---- */
const isPlaceholder=v=>{
  v=String(v||"").trim();
  return !v||/^[-—/\\.、,,;;\s]+$/.test(v)||/^(无|没有|暂无|N\/?A|NA|null|none|不适用|未对应|待定)$/i.test(v);
};

/* ---- 区域兜底(行内「区域」为空时按国家名映射) ---- */
const REGION_FALLBACK={UNECE:"国际",GTR:"国际",ARSO:"国际",GSO:"中东","GB标准体系":"国际","欧盟/UNECE体系":"国际","美标体系":"国际"};
const REGIONS=["亚洲","欧洲","非洲","北美","南美","中东","大洋洲","国际","其他"];
function normRegion(s,country){
  s=String(s||"").trim();
  if(!s)s=REGION_FALLBACK[country]||"其他";
  if(/亚太|东亚|东南亚|南亚|中亚|亚洲/.test(s))return "亚洲";
  if(/欧/.test(s)&&!/欧亚/.test(s))return "欧洲";
  if(/欧亚/.test(s))return "亚洲";
  if(/非/.test(s))return "非洲";
  if(/北美|美国|加拿大/.test(s))return "北美";
  if(/南美|拉美|拉丁/.test(s))return "南美";
  if(/中东|海湾|西亚/.test(s))return "中东";
  if(/大洋|澳/.test(s))return "大洋洲";
  if(/国际|全球/.test(s))return "国际";
  return REGIONS.includes(s)?s:"其他";
}

/* ---- 表头探测用关键列名 ---- */
const KEYCOLS=["序号","区域","国家","法规编号","法规中文名称","法规英文名称","法规原文名称",
  "法规类型","法规类别","法规性质","法规领域","管理机构","有无原文","发布日期","生效日期",
  "对应国标","对应欧标","对应美标","适用车型类型","适用动力类型","备注"];
const SKIP_SHEET_RE=/更新|草案|说明|索引|提案|看板|公告|修订|维度涵盖|报告/;
const SKIP_SHEET_NAMES=new Set(["Sheet3","Sheet5"]);
const GENERIC_SHEET_RE=/^(sheet\s*\d*|表\d*|数据|清单|汇总|总表|明细|模板|目录|首页|封面)$/i;

/* parseWorkbook:逐 sheet 解析一个 Excel 文件 → 标准化行数组
 * 1) 跳过辅助 sheet;2) 前 6 行内探测表头(命中 ≥4 个关键列名);
 * 3) 编号+中文名均空的行跳过;4) 区域汇总文件按行内「国家」列自然展开;
 * 5) 行内「国家」为空且 sheet 名非通用名时,用 sheet 名兜底;6) 空表跳过不报错 */
function parseSheets(sheetEntries,fileName){
  const rows=[];
  for(const {name:snRaw,aoa} of sheetEntries){
    const sn=String(snRaw).trim();
    if(SKIP_SHEET_RE.test(sn)||SKIP_SHEET_NAMES.has(sn))continue;
    if(!aoa||!aoa.length)continue;
    let hi=-1,map=null;
    for(let i=0;i<Math.min(6,aoa.length);i++){
      const cells=(aoa[i]||[]).map(c=>String(c??"").trim());
      const hit=cells.filter(c=>KEYCOLS.includes(c)).length;
      if(hit>=4){hi=i;map={};cells.forEach((c,j)=>{if(c&&map[c]===undefined)map[c]=j;});break;}
    }
    if(hi<0)continue;
    for(let i=hi+1;i<aoa.length;i++){
      const row=aoa[i]||[];
      const get=k=>map[k]===undefined?"":String(row[map[k]]??"").trim();
      const id=get("法规编号"),nm=get("法规中文名称");
      if(!id&&!nm)continue;
      let cty=get("国家");
      if(!cty&&!GENERIC_SHEET_RE.test(sn))cty=sn;
      if(!cty)continue;
      rows.push({国家:cty,区域:get("区域"),法规编号:id,法规中文名称:nm,
        法规英文名称:get("法规英文名称"),法规类型:get("法规类型"),法规类别:get("法规类别"),
        法规领域:get("法规领域"),管理机构:get("管理机构"),生效日期:get("生效日期"),
        对应国标:get("对应国标"),对应欧标:get("对应欧标"),对应美标:get("对应美标"),
        _src:fileName+" / "+sn});
    }
  }
  return rows;
}
async function parseWorkbook(file){
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array"});
  const entries=wb.SheetNames.map(sn=>({name:sn,
    aoa:XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:""})}));
  return parseSheets(entries,file.name);
}

/* rowsToGraph:标准化行 → {detail, overview} 两级图数据
 * detail:每条法规一个节点(belongs→国家,cross→三大标准体系)
 * overview:按(国家,领域)聚合的气泡 + 国家→体系的聚合跨国边 */
const SYSTEMS=[["对应国标","GB标准体系"],["对应欧标","欧盟/UNECE体系"],["对应美标","美标体系"]];
function rowsToGraph(rows){
  const entities=new Map(); // country → {region,count}
  rows.forEach(r=>{
    const c=normCountry(r.国家); if(!c)return;
    const e=entities.get(c)||{region:null,count:0};
    e.count++; if(!e.region&&r.区域)e.region=normRegion(r.区域,c);
    entities.set(c,e);
  });
  entities.forEach((e,c)=>{if(!e.region)e.region=normRegion("",c);});
  const catIndex={entity:0};DOMAIN_CATS.forEach((d,i)=>catIndex[d.name]=i+1);
  const categories=[{name:"entity",itemStyle:{color:"#2b2b2b"}},
    ...DOMAIN_CATS.map(d=>({name:d.name,itemStyle:{color:d.color}}))];

  const entNode=(name,region,big)=>({id:name,name,type:"entity",category:0,
    区域:region,symbolSize:big?56:48,itemStyle:{color:"#2b2b2b"},label:{show:true}});
  const BIG=new Set(["UNECE","GTR","GB标准体系","欧盟/UNECE体系","美标体系"]);

  const dNodes=[],dLinks=[],oNodes=[],oLinks=[];
  entities.forEach((e,c)=>{const n=entNode(c,e.region,BIG.has(c));dNodes.push(n);oNodes.push({...n});});
  SYSTEMS.forEach(([,sys])=>{const n=entNode(sys,"国际",true);dNodes.push(n);oNodes.push({...n});});

  // 明细级
  const seen=new Set(),crossAgg={};
  const groups={}; // country::domain → {count,rows}
  rows.forEach(r=>{
    const c=normCountry(r.国家); if(!c||!entities.has(c))return;
    let key=r.法规编号||String(r.法规中文名称||"").slice(0,20);
    let id=c+"::"+key,k=2;
    while(seen.has(id))id=c+"::"+key+"#"+(k++);
    seen.add(id);
    const dom=normDomain(r.法规领域);
    const major=/技术法规|框架法规|管理条例/.test(r.法规类别||"");
    dNodes.push({id,name:r.法规中文名称||r.法规编号,type:"regulation",
      category:catIndex[dom.name],symbolSize:major?15:12,
      itemStyle:{color:dom.color},label:{show:false},
      attrs:{编号:r.法规编号,英文名:r.法规英文名称,类型:r.法规类型,类别:r.法规类别,
        领域:dom.name,机构:r.管理机构,生效:r.生效日期,来源:r._src||""}});
    dLinks.push({source:id,target:c,relation:"belongs"});
    SYSTEMS.forEach(([col,sys])=>{
      if(!isPlaceholder(r[col])){
        dLinks.push({source:id,target:sys,relation:"cross"});
        const ck=c+"→"+sys;crossAgg[ck]=(crossAgg[ck]||0)+1;
      }});
    const gk=c+"::"+dom.name;
    (groups[gk]=groups[gk]||{country:c,dom,count:0,ids:[]}).count++;
    groups[gk].ids.push(id);
  });

  // 概览级:领域气泡 + 聚合跨国边
  Object.entries(groups).forEach(([gk,g])=>{
    oNodes.push({id:gk,name:g.dom.name+"("+g.count+")",type:"regulation_group",
      category:catIndex[g.dom.name],country:g.country,domain:g.dom.name,count:g.count,
      symbolSize:Math.min(46,10+Math.sqrt(g.count)*4),
      itemStyle:{color:g.dom.color},label:{show:false}});
    oLinks.push({source:gk,target:g.country,relation:"belongs"});
  });
  Object.entries(crossAgg).forEach(([ck,n])=>{
    const [c,sys]=ck.split("→");
    oLinks.push({source:c,target:sys,relation:"cross",value:n,
      lineStyle:{width:Math.min(1+Math.log2(n+1),5)}});
  });
  const meta={entities:entities.size,regulations:seen.size,
    groups:Object.keys(groups).length,cross:Object.keys(crossAgg).length};
  return {detail:{nodes:dNodes,links:dLinks,categories},
          overview:{nodes:oNodes,links:oLinks,categories},meta,groups};
}

/* ---- 内置小示例(无数据库、无上传时的演示) ---- */
const SAMPLE_ROWS=[
 {国家:"日本",区域:"亚洲",法规编号:"TRIAS 12",法规中文名称:"制动安全测试",法规领域:"安全",法规类别:"技术法规",对应国标:"GB 21670",对应欧标:"UN R13-H",对应美标:""},
 {国家:"日本",区域:"亚洲",法规编号:"TRIAS 31",法规中文名称:"排放测试方法",法规领域:"节能环保",法规类别:"技术法规",对应国标:"GB 18352",对应欧标:"UN R83",对应美标:"EPA 40 CFR"},
 {国家:"日本",区域:"亚洲",法规编号:"道路运送车辆法",法规中文名称:"道路运送车辆法",法规领域:"安全",法规类别:"框架法规",对应国标:"-",对应欧标:"-",对应美标:"-"},
 {国家:"德国",区域:"欧洲",法规编号:"StVZO 21",法规中文名称:"车辆注册许可",法规领域:"注册上牌",法规类别:"管理条例",对应国标:"",对应欧标:"(EU) 2018/858",对应美标:""},
 {国家:"德国",区域:"欧洲",法规编号:"EMC-RL",法规中文名称:"电磁兼容指令转化",法规领域:"汽车电子",法规类别:"技术法规",对应国标:"GB 14023",对应欧标:"UN R10",对应美标:"SAE J1113"},
 {国家:"巴西",区域:"南美",法规编号:"CONTRAN 717",法规中文名称:"灯光装置要求",法规领域:"照明",法规类别:"技术法规",对应国标:"GB 4785",对应欧标:"UN R48",对应美标:"FMVSS 108"},
 {国家:"巴西",区域:"南美",法规编号:"PROCONVE L8",法规中文名称:"轻型车排放限值",法规领域:"节能环保",法规类别:"技术法规",对应国标:"GB 18352",对应欧标:"Euro 6",对应美标:"EPA Tier 3"},
];

/* =====================================================================
 * 第二部分:渲染(ECharts graph + 分区布局 + 两级视图 + 下钻)
 * ===================================================================== */
let chart=null,GRAPH=null,mode="cross",curView="overview",drill=null,allRows=[];
const $=s=>document.querySelector(s);
function toast(m){const t=$("#toast");if(!t)return;t.textContent=m;t.classList.add("on");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2600);}

/* 分区初始坐标:entity 按区域分扇区排开,法规/气泡环绕其国家 */
function seedPositions(nodes,links){
  const W=1600,H=1000;
  const regAngle={};REGIONS.forEach((r,i)=>regAngle[r]=(i/REGIONS.length)*Math.PI*2-Math.PI/2);
  const ents=nodes.filter(n=>n.type==="entity");
  const byReg={};ents.forEach(n=>{(byReg[n.区域||"其他"]=byReg[n.区域||"其他"]||[]).push(n);});
  const pos={};
  Object.entries(byReg).forEach(([reg,list])=>{
    const a0=regAngle[reg]??regAngle["其他"];
    list.forEach((n,i)=>{
      const ring=Math.floor(i/8),a=a0+((i%8)-3.5)*0.13;
      const r=H*0.32+ring*90;
      pos[n.id]=[Math.cos(a)*r*1.35,Math.sin(a)*r];
      n.x=pos[n.id][0];n.y=pos[n.id][1];
    });
  });
  // 体系节点放中心
  ["GB标准体系","欧盟/UNECE体系","美标体系"].forEach((s,i)=>{
    const n=nodes.find(x=>x.id===s);
    if(n){n.x=(i-1)*170;n.y=0;pos[s]=[n.x,n.y];}
  });
  // 非 entity 节点:落在其所属国家附近
  const owner={};links.forEach(l=>{if(l.relation==="belongs")owner[l.source]=l.target;});
  nodes.forEach(n=>{
    if(n.type==="entity")return;
    const p=pos[owner[n.id]];
    const a=Math.random()*Math.PI*2,r=30+Math.random()*55;
    n.x=(p?p[0]:0)+Math.cos(a)*r;n.y=(p?p[1]:0)+Math.sin(a)*r;
  });
}

function linkStyles(links){
  return links.map(l=>{
    const active=mode==="cross"?l.relation==="cross":l.relation==="belongs";
    return {...l,
      lineStyle:{...(l.lineStyle||{}),
        opacity:active?0.18:0.04,
        color:l.relation==="cross"?"#c6502a":"#8d8674",
        curveness:l.relation==="cross"?0.18:0}};
  });
}

function render(nodes,links,viewName){
  seedPositions(nodes,links);
  const big=nodes.length>1500;
  chart.setOption({
    backgroundColor:"#f5f3ef",
    tooltip:{confine:true,formatter:p=>{
      if(p.dataType==="edge")return (p.data.relation==="cross"?"跨国引用":"归属")+(p.data.value?" · "+p.data.value+" 条":"");
      const d=p.data;
      if(d.type==="entity")return `<b>${d.name}</b><br>区域:${d.区域||"—"}`;
      if(d.type==="regulation_group")return `<b>${d.country} · ${d.name}</b><br>点击下钻明细`;
      const a=d.attrs||{};
      return `<b>${d.name}</b><br>`+["编号","英文名","类别","领域","机构","生效"]
        .filter(k=>a[k]).map(k=>k+":"+a[k]).join("<br>");
    }},
    legend:{data:GRAPH.detail.categories.map(c=>c.name).filter(n=>n!=="entity"),
      textStyle:{fontSize:10},bottom:4,type:"scroll"},
    series:[{
      type:"graph",layout:"force",roam:true,draggable:true,
      data:nodes,links:linkStyles(links),categories:GRAPH.detail.categories,
      force:{repulsion:big?60:230,gravity:big?0.08:0.035,
        edgeLength:big?[28,70]:[60,150],friction:0.25,layoutAnimation:!big},
      label:{position:"right",fontSize:10,color:"#1a2420"},
      labelLayout:{hideOverlap:true},
      emphasis:{focus:"adjacency",lineStyle:{opacity:0.85,width:2},
        label:{show:true,fontWeight:600}},
      blur:{itemStyle:{opacity:0.12},lineStyle:{opacity:0.02},label:{show:false}},
      lineStyle:{width:1},
      select:{itemStyle:{borderColor:"#c6502a",borderWidth:2}},
      scaleLimit:{min:0.25,max:8},
    }]
  },{notMerge:true});
  curView=viewName;
  $("#st-view").textContent=`视图:${viewName==="overview"?"概览(国家×领域气泡)":"下钻:"+viewName} · 节点 ${nodes.length} · 边 ${links.length} · 模式:${mode==="cross"?"跨国联动":"单国内部"}`;
}

function renderOverview(){drill=null;render(GRAPH.overview.nodes.map(n=>({...n})),GRAPH.overview.links,"overview");}
function restoreOverview(){if(GRAPH)renderOverview();}

/* 下钻:展开某国全部 / 某(国家,领域)气泡的明细法规 */
function drillInto(country,domain){
  const ids=new Set();
  Object.values(GRAPH.groups).forEach(g=>{
    if(g.country===country&&(!domain||g.dom.name===domain))g.ids.forEach(id=>ids.add(id));
  });
  if(!ids.size)return;
  const keepEnt=new Set([country,"GB标准体系","欧盟/UNECE体系","美标体系"]);
  const nodes=GRAPH.detail.nodes.filter(n=>ids.has(n.id)||keepEnt.has(n.id)).map(n=>({...n}));
  const links=GRAPH.detail.links.filter(l=>ids.has(l.source)&&(keepEnt.has(l.target)||ids.has(l.target)));
  drill={country,domain};
  render(nodes,links,country+(domain?" · "+domain:" 全部领域")+`(${ids.size} 条)`);
}

function setMode(m){
  mode=m;
  $("#m-cross").classList.toggle("on",m==="cross");
  $("#m-belong").classList.toggle("on",m==="belongs");
  if(!chart||!GRAPH)return;
  const opt=chart.getOption();
  chart.setOption({series:[{links:linkStyles(opt.series[0].links)}]});
  $("#st-view").textContent=$("#st-view").textContent.replace(/模式:.+$/,"模式:"+(m==="cross"?"跨国联动":"单国内部"));
}

function setGraphFromRows(rows,srcLabel){
  allRows=rows;
  GRAPH=rowsToGraph(rows);
  $("#st-data").textContent=`数据:${srcLabel} · ${GRAPH.meta.entities} 国/体系 · ${GRAPH.meta.regulations} 条法规 · 跨国引用对 ${GRAPH.meta.cross}`;
  renderOverview();
}

/* ---- 数据入口 1:团队数据库(默认) ---- */
async function loadFromDB(){
  const SB=window.REGMON_CONFIG;
  const rich="country,reg_id,cn_name,en_name,domain,ref_cn,ref_eu,ref_us,"
    +"region:raw->>区域,cat:raw->>法规类别,typ:raw->>法规类型,agy:raw->>管理机构,eff:raw->>生效日期";
  const plain="country,reg_id,cn_name,en_name,domain,ref_cn,ref_eu,ref_us";
  async function fetchAll(sel){
    const page=1000;let rows=[],off=0;
    for(;;){
      const res=await fetch(SB.url+"/rest/v1/regulations?select="+encodeURIComponent(sel)
        +"&limit="+page+"&offset="+off,
        {headers:{apikey:SB.anonKey,Authorization:"Bearer "+SB.anonKey}});
      if(!res.ok)throw new Error("DB HTTP "+res.status);
      const part=await res.json();rows=rows.concat(part);
      if(part.length<page)break;off+=page;
    }
    return rows;
  }
  let rows;
  try{rows=await fetchAll(rich);}
  catch(e){rows=await fetchAll(plain);} // raw 字段取不到时退回普通列(区域走兜底映射)
  return rows.map(r=>({国家:r.country,区域:r.region||"",法规编号:r.reg_id||"",
    法规中文名称:r.cn_name||"",法规英文名称:r.en_name||"",法规领域:r.domain||"",
    法规类别:r.cat||"",法规类型:r.typ||"",管理机构:r.agy||"",生效日期:r.eff||"",
    对应国标:r.ref_cn||"",对应欧标:r.ref_eu||"",对应美标:r.ref_us||""}));
}

/* ---- 数据入口 2:上传 Excel(并入当前图,去重 国家+编号) ---- */
async function handleUpload(files){
  if(!files.length)return;
  toast("解析中…");
  let added=[];
  for(const f of files){
    try{added=added.concat(await parseWorkbook(f));}
    catch(err){console.error(err);toast("解析失败:"+f.name);}
  }
  const seen=new Set(allRows.map(r=>normCountry(r.国家)+"|"+(r.法规编号||r.法规中文名称)));
  const fresh=added.filter(r=>{
    const k=normCountry(r.国家)+"|"+(r.法规编号||r.法规中文名称);
    if(seen.has(k))return false;seen.add(k);return true;});
  if(!fresh.length&&!added.length){toast("文件中没有可识别的法规数据(检查表头是否在前6行)");return;}
  setGraphFromRows(allRows.concat(fresh),"数据库+上传(新增 "+fresh.length+" 条,重复 "+(added.length-fresh.length)+" 条已去重)");
  toast("已并入 "+fresh.length+" 条(本页为可视化,不写入数据库)");
}

/* ---- 数据入口 3:内置演示(预生成 lite JSON,失败用内置小样例) ---- */
async function loadDemo(){
  try{
    const r=await fetch("./data/regulation_network_lite.json");
    const j=await r.json();
    GRAPH={detail:{nodes:j.nodes,links:j.links,categories:j.categories},
      overview:{nodes:j.nodes,links:j.links,categories:j.categories},
      meta:{entities:j.meta.entities,regulations:j.meta.regulation_groups,cross:j.meta.cross},groups:{}};
    allRows=[];
    $("#st-data").textContent="数据:内置演示 lite("+j.nodes.length+" 节点)";
    render(j.nodes.map(n=>({...n})),j.links,"overview");
  }catch(e){setGraphFromRows(SAMPLE_ROWS,"内置小样例");}
}

/* ---- 启动 ---- */
function init(){
  chart=echarts.init(document.getElementById("chart"));
  document.getElementById("up").addEventListener("change",e=>{
    const files=[...e.target.files];e.target.value="";handleUpload(files);
  });
  chart.on("click",p=>{
    if(p.dataType!=="node")return;
    const d=p.data;
    if(curView==="overview"){
      if(d.type==="regulation_group")drillInto(d.country,d.domain);
      else if(d.type==="entity"&&!["GB标准体系","欧盟/UNECE体系","美标体系"].includes(d.id))drillInto(d.id,null);
    }
  });
  chart.getZr().on("click",ev=>{if(!ev.target&&drill)restoreOverview();}); // 点空白返回概览
  window.addEventListener("resize",()=>chart.resize());
  $("#st-data").textContent="正在读取团队数据库…";
  loadFromDB().then(rows=>{
    if(rows.length)setGraphFromRows(rows,"团队数据库(实时)");
    else setGraphFromRows(SAMPLE_ROWS,"内置小样例(数据库为空)");
  }).catch(err=>{
    console.error(err);
    toast("数据库连接失败,载入演示数据");
    loadDemo();
  });
}
if(typeof document!=="undefined"&&typeof echarts!=="undefined")init();
/* node 测试导出(浏览器中无副作用) */
if(typeof module!=="undefined"&&module.exports)
  module.exports={parseSheets,rowsToGraph,normCountry,normDomain,normRegion,isPlaceholder};
</script>
