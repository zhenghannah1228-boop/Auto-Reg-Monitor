<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09 认证金字塔</title>
<style>
:root{--bg:#f4f1ec;--panel:#fff;--ink:#2a2438;--mut:#8a8398;--line:#e4ded5;
--p1:#3d2f5c;--p2:#5b4789;--p3:#7e6bb0;--p4:#a99bd4;--accent:#c4453f;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:24px}
.head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
select{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:9px 14px;border-radius:8px;font-size:14px;min-width:160px}
.hint{color:var(--mut);font-size:13px}
.cname{font-size:24px;font-weight:700;margin:6px 0 2px;display:flex;align-items:center;gap:10px}
.badge{font-size:12px;padding:3px 10px;border-radius:20px;font-weight:500}
.badge.type{background:#efe9f7;color:#5b4789}
.badge.grade{background:#e6f4ea;color:#2e7d46}
.badge.src{background:#fdecec;color:#c4453f}
.tagline{color:#6b6478;font-size:13.5px;margin-bottom:20px;max-width:780px}
.main{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
.pyramid{display:flex;flex-direction:column;gap:8px}
.layer{border-radius:10px;padding:16px 18px;color:#fff;cursor:pointer;transition:.15s;position:relative}
.layer:hover{transform:translateX(3px);filter:brightness(1.08)}
.layer.sel{outline:3px solid var(--accent);outline-offset:2px}
.layer .lv{font-size:11px;opacity:.7;letter-spacing:1px}
.layer .role{font-size:11px;opacity:.75;float:right}
.layer .ncn{font-size:15px;font-weight:600;margin-top:3px}
.layer .nen{font-size:11.5px;opacity:.8}
.l1{background:linear-gradient(135deg,var(--p1),var(--p2));margin-right:0}
.l2{background:linear-gradient(135deg,var(--p2),var(--p3));margin-right:8%}
.l3{background:linear-gradient(135deg,var(--p3),var(--p4));margin-right:18%}
.l4{background:linear-gradient(135deg,var(--p4),#c3b8e3);margin-right:30%}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;min-height:200px}
.panel .pl{font-size:11px;color:var(--mut);letter-spacing:1px}
.panel h3{font-size:17px;margin:4px 0 2px}
.panel .en{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.panel .dt{font-size:13.5px;color:#4a4458;margin-bottom:14px}
.reg{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px}
.reg .no{font-weight:600;color:#5b4789}
.reg .lib{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:12px}
.reg .lib.y{background:#e6f4ea;color:#2e7d46}
.reg .lib.n{background:#fdecec;color:#c4453f}
.sect{margin-top:22px}
.sect h4{font-size:13px;color:var(--mut);margin-bottom:10px;letter-spacing:.5px}
.auth{border-left:3px solid var(--p3);padding:4px 0 4px 12px;margin-bottom:12px}
.auth .an{font-weight:600;font-size:13.5px}
.auth .aa{font-size:11px;color:#fff;background:var(--p3);padding:1px 7px;border-radius:4px;margin-left:6px}
.auth .ad{font-size:12.5px;color:#6b6478;margin-top:2px}
.core .grp{margin-bottom:10px}
.core .gn{font-weight:600;font-size:13px;color:#3d2f5c}
.core .gi{font-size:12.5px;color:#555;margin-top:2px}
.src-link{font-size:12px;color:var(--accent);cursor:pointer;text-decoration:underline;margin-top:4px;display:inline-block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px}
@media(max-width:820px){.main,.two{grid-template-columns:1fr}}
</style></head><body>
<div class="head">
  <select id="country"></select>
  <select id="filter"><option value="">全部体系类型</option><option>自有型</option><option>采纳型</option><option>混合型</option></select>
  <span class="hint">选国家看其汽车型式认证体系金字塔（顶=母法/框架 → 底=最终证书）</span>
</div>
<div id="view"></div>
<script>
const PYR = {"马来西亚": {"country": "马来西亚", "country_type": "混合型", "data_grade": "A", "tagline": "拥有自有的车辆型式批准(VTA)制度，同时大量直接承认 ECE/E-mark 证书；UN R 为技术主体。", "layers": [{"level": "L1", "role": "母法 / 顶端", "name_cn": "1987年陆路交通法令", "name_en": "Road Transport Act 1987 (Act 333)", "detail": "最高法律依据，确立车辆注册、使用与安全监管的法定基础，授权 JPJ 执行 VTA。", "regulations": [{"reg_no": "Act 333", "name": "Road Transport Act 1987", "match_key": "Act 333", "_lib": 0}, {"reg_no": "UU 22/2009", "name": "道路交通与运输法", "match_key": "UU 22/2009", "_lib": 1}]}, {"level": "L2", "role": "技术基准", "name_cn": "UN 法规(UNR) + 马来西亚标准(MS)", "name_en": "UN Regulations / Malaysia Standards", "detail": "技术测试基准：直接采用 UN R 系列法规，并辅以本土 MS 标准。", "regulations": []}, {"level": "L3", "role": "审查 / 测试", "name_cn": "指定技术服务机构(TS)测试", "name_en": "Designated Technical Services", "detail": "由指定技术服务机构执行型式测试与审查。", "regulations": []}, {"level": "L4", "role": "批准 / 证书", "name_cn": "车辆型式批准 VTA / 零部件 CTA", "name_en": "Vehicle Type Approval / Component Type Approval", "detail": "最终签发整车型式批准(VTA)与零部件型式批准(CTA)证书。", "regulations": []}], "authorities": [{"name": "马来西亚交通部", "abbr": "MOT", "desc": "汽车产品法规的最高决策和主管机构，制定陆路交通、车辆安全与环保宏观政策。"}, {"name": "马来西亚陆路交通局", "abbr": "JPJ", "desc": "整车认证的强制管理与批准机构，实施 VTA 制度、颁发 E52 的 ECE 认证证书，代表马来西亚参与 UN WP.29。"}], "core_regulations": {"整车": [{"group": "被动安全", "items": "正面碰撞 R94、侧面 R95、安全带及固定点 R14/R16、座椅及头枕 R17/R25、行人保护 R127"}, {"group": "主动安全", "items": "制动 R13/R13H、转向 R79、电子稳定控制 R140"}, {"group": "通用安全", "items": "防盗 R18/R97/R116、防火 R34、车速表 R39、电磁兼容 R10"}]}, "sources": [], "decoded_from_tweet": false, "last_updated": "2026-06-10", "_source_titles": {}}, "巴西": {"country": "巴西", "country_type": "混合型", "data_grade": "B", "tagline": "混合借鉴 ECE/UN R 与美国 FMVSS，经 CONTRAN/CONAMA/INMETRO 本土化为强制法规；非1958协议成员国，ECE 无自动效力。", "layers": [{"level": "L1", "role": "母法 / 顶端", "name_cn": "巴西本土强制法规体系", "name_en": "CONTRAN / CONAMA / INMETRO", "detail": "具有法律强制力的本土法规来源。安全由 CONTRAN 决议、环保由 CONAMA、零部件由 INMETRO 分管。巴西非1958协议/WP29成员，ECE 法规无自动法律效力。", "regulations": [{"reg_no": "CONTRAN 721/2018", "name": "动态侧碰测试要求(基于UN R95)", "match_key": "CONTRAN 721", "_lib": 0}, {"reg_no": "CONTRAN 749/2018", "name": "电动车安全(认可UN R100/R94/R95或FMVSS 305)", "match_key": "CONTRAN 749", "_lib": 1}, {"reg_no": "SENATRAN 990/2022", "name": "等效ECE/FMVSS接受规则", "match_key": "SENATRAN 990", "_lib": 0}]}, {"level": "L2", "role": "技术基准", "name_cn": "国际参考标准(被借鉴)", "name_en": "ECE / UN R / FMVSS", "detail": "技术测试方法标准，被巴西「借鉴」而非直接采纳。安全大量借鉴 ECE，排放轻型车用美标 FTP-75、重型车对标欧标。等效 ECE/FMVSS 自 SENATRAN 990/2022 起不再被默认接受，除非 CONTRAN 明确提及。", "regulations": [{"reg_no": "UN Regulation No. 95", "name": "侧面碰撞保护", "match_key": "UN R95", "_lib": 4}, {"reg_no": "UN Regulation No. 100", "name": "电动车辆安全", "match_key": "UN R100", "_lib": 5}, {"reg_no": "FMVSS 305", "name": "电动车电解液泄漏与电击防护", "match_key": "FMVSS 305", "_lib": 2}]}, {"level": "L3", "role": "审查 / 测试", "name_cn": "本地或指定实验室测试", "name_en": "Local / Designated Labs (ABNT NBR)", "detail": "CONTRAN 未提及 ECE 等效性的项目、或有巴西特殊要求(防盗/乙醇适配)的项目，必须在巴西或指定实验室完成测试。执行标准部分等效 ECE、部分为 ABNT NBR 国标。", "regulations": []}, {"level": "L4", "role": "批准 / 证书", "name_cn": "CAT整车认证 / LCVM排放 / INMETRO零部件", "name_en": "CAT / LCVM / INMETRO Certificates", "detail": "最终强制证书：整车 CAT(合规认证)、排放 LCVM、关键零部件(轮胎/玻璃/蓄电池)由 INMETRO 强制认证并贴标。", "regulations": []}], "authorities": [{"name": "国家交通委员会", "abbr": "CONTRAN", "desc": "安全法规核心，以决议(Resolução)形式发布强制要求，大量借鉴 ECE 技术内容。"}, {"name": "国家环境委员会", "abbr": "CONAMA", "desc": "环保与排放法规主管，PROCONVE 空气污染控制计划的发布机构。"}, {"name": "国家计量质量与技术局", "abbr": "INMETRO", "desc": "关键零部件(轮胎/制动衬片/安全玻璃/蓄电池)强制认证与贴标机构。"}, {"name": "国家交通秘书处", "abbr": "SENATRAN", "desc": "原 DENATRAN，管理安全认证体系，990/2022 号令规定等效标准接受规则。"}], "core_regulations": {"整车": [{"group": "被动安全", "items": "侧碰 CONTRAN 721/2018(基于UN R95)、商用车驾驶室强度(ECE R29)"}, {"group": "灯光", "items": "CONTRAN 227/2007(参考 ECE R48 前照灯、R27 三角警示牌)"}, {"group": "新能源", "items": "CONTRAN 749/2018(认可 UN R100/R94/R95 或 FMVSS 305)"}], "排放": [{"group": "PROCONVE", "items": "轻型车美标 FTP-75 工况(限值命名对标欧标 L6≈欧V/L7≈欧V+/L8≈欧VI)、重型车欧标 ESC/ETC 循环"}], "零部件": [{"group": "INMETRO强制", "items": "轮胎(ECE R30/R54)、制动衬片(INMETRO 55/2014 参考 ECE R13/H)、阻燃材料(CONTRAN 498/2014≈ECE R118)"}]}, "sources": ["INS-2026-019"], "decoded_from_tweet": true, "last_updated": "2026-06-11", "_source_titles": {"INS-2026-019": "巴西认证为何混合联合国、美国法规？ECE、UN R、CONTRAN与RESOLUTION的区别"}}, "印度": {"country": "印度", "country_type": "自有型", "data_grade": "A", "tagline": "自有 CMVR 型式认证体系，不认可 E-mark/CCC；AIS 为强制技术标准，ARAI 为核心认证机构，本国制造业保护强。", "layers": [{"level": "L1", "role": "母法 / 顶端", "name_cn": "中央机动车辆法规 CMVR", "name_en": "Central Motor Vehicles Rules (1989)", "detail": "母法，1989颁布、1991实施。规定整车及零部件进入印度前须申请型式认证批准；第126条定义型式认可。标准委员会 CMVR-TSC 隶属印度船舶/道路交通及高速公路管理局。", "regulations": [{"reg_no": "CMVR", "name": "中央机动车辆法规", "match_key": "CMVR", "_lib": 0}]}, {"level": "L2", "role": "技术基准", "name_cn": "印度汽车工业标准 AIS + 国家标准 IS", "name_en": "Automotive Industry Standards / Indian Standards", "detail": "技术基准。AIS 由 AISC 制定、是 CMVR 强制组成部分；AIS 未涉及的产品(如雨刮片)参照 BIS 发布的 IS 国家标准。印度不认可 E-mark 等效。", "regulations": [{"reg_no": "AIS 007", "name": "技术规格书/图纸格式", "match_key": "AIS 007", "_lib": 0}, {"reg_no": "AIS 标准体系", "name": "印度汽车工业标准", "match_key": "AIS", "_lib": 0}, {"reg_no": "IS 标准(BIS)", "name": "印度国家标准", "match_key": "IS", "_lib": 12}]}, {"level": "L3", "role": "审查 / 测试", "name_cn": "ARAI 测试 + 工厂审核", "name_en": "ARAI Testing & Factory Audit", "detail": "ARAI(浦那)依据 CMVR/AIS/IS 测试整车及零部件；样品必须送印度本地实验室，不允许国内测试。初次申请样品测试通过后派员现场工厂审核；获证后每1-2年工厂监督检查。", "regulations": []}, {"level": "L4", "role": "批准 / 证书", "name_cn": "ARAI 型式批准 + 强制 ISI 部件认证", "name_en": "ARAI Type Approval / ISI Component Cert", "detail": "ARAI 签发认证证书与测试报告、分配型式批准号(须打在产品上)。强制 ISI 部件须先获认证才能申请整车 ARAI。证书长期有效但依赖年度工厂检查；新车理想45工作日(实际4-6月)，费用约8-15万。", "regulations": []}], "authorities": [{"name": "印度汽车研究协会", "abbr": "ARAI", "desc": "隶属重工业与公共事业部，位于浦那，印度汽车及零部件认证的核心机构，依据 CMVR/AIS/IS 测试并签发型式批准。"}, {"name": "印度汽车工业标准委员会", "abbr": "AISC", "desc": "AIS 标准的制定与修订机构，其标准是 ARAI 测试认证的重要依据。"}, {"name": "印度标准局", "abbr": "BIS", "desc": "发布 IS 国家标准，负责 AIS 未涉及产品及强制 ISI 部件的认证。"}, {"name": "CMVR 技术常设委员会", "abbr": "CMVR-TSC", "desc": "隶属船舶/道路交通及高速公路管理局，制定实施技术标准与测试要求。"}], "core_regulations": {"整车": [{"group": "适用类别", "items": "两轮/三轮、四轮乘用及货车(M1/N1)、轻重型商用车(M2/M3/N2/N3)、工程设备车(CEV)、农用拖拉机、挂车、电动车 BOV、CNG/LPG 车"}], "零部件": [{"group": "强制认证", "items": "安全玻璃、制动软管、轮胎、CNG调压阀、灯泡、后视镜、限速器、安全带、三角警告牌、门锁门铰链、燃油箱、儿童座椅、刹车片、动力电池等"}]}, "sources": ["INS-2024-001"], "decoded_from_tweet": true, "last_updated": "2026-06-11", "_source_titles": {"INS-2024-001": "印度汽车准入认证要求概述：CMVR/AIS/IS 与 ARAI/BIS 体系"}}};
const sel = document.getElementById('country');
Object.keys(PYR).forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});
let curLayer = 0;

function libBadge(n){return n>0?`<span class="lib y">库${n}</span>`:`<span class="lib n">待补充</span>`;}

function render(){
  const c = sel.value; const p = PYR[c]; if(!p)return;
  const srcBadge = p.decoded_from_tweet?`<span class="badge src">解码自推文</span>`:'';
  const layers = p.layers.map((L,i)=>`
    <div class="layer l${i+1} ${i===curLayer?'sel':''}" onclick="pick('${c}',${i})">
      <span class="lv">${L.level}</span><span class="role">${L.role}</span>
      <div class="ncn">${L.name_cn}</div><div class="nen">${L.name_en||''}</div>
    </div>`).join('');
  const L = p.layers[curLayer];
  const regs = (L.regulations||[]).map(r=>`
    <div class="reg"><span class="no">${r.reg_no}</span>${r.name?'<span style="color:#888">'+r.name+'</span>':''}${libBadge(r._lib||0)}</div>`).join('') || '<div style="color:#aaa;font-size:12px">本层无具体法规编号</div>';
  const auths = (p.authorities||[]).map(a=>`
    <div class="auth"><span class="an">${a.name}</span><span class="aa">${a.abbr}</span><div class="ad">${a.desc||''}</div></div>`).join('');
  let core='';
  for(const [cat,groups] of Object.entries(p.core_regulations||{})){
    core+=`<div class="core" style="margin-bottom:14px"><div class="gn" style="font-size:13.5px;border-bottom:1px solid #eee;padding-bottom:4px;margin-bottom:8px">${cat}</div>`;
    core+=groups.map(g=>`<div class="grp"><span class="gn">${g.group}：</span><span class="gi">${g.items}</span></div>`).join('');
    core+='</div>';
  }
  const srcs=(p.sources||[]).map(sid=>`<span class="src-link" title="来源推文">📄 ${sid}${p._source_titles&&p._source_titles[sid]?'：'+p._source_titles[sid]:''}</span>`).join('<br>');

  document.getElementById('view').innerHTML=`
    <div class="cname">${c} <span class="badge type">${p.country_type}</span><span class="badge grade">资料${p.data_grade}</span>${srcBadge}</div>
    <div class="tagline">${p.tagline||''}</div>
    <div class="main">
      <div class="pyramid">${layers}</div>
      <div class="panel">
        <div class="pl">${L.role} · 第 ${curLayer+1} 层</div>
        <h3>${L.name_cn}</h3><div class="en">${L.name_en||''}</div>
        <div class="dt">${L.detail||''}</div>
        ${regs}
      </div>
    </div>
    <div class="two">
      <div class="panel"><div class="sect"><h4>主管机构</h4>${auths||'<span style="color:#aaa">—</span>'}</div></div>
      <div class="panel"><div class="sect"><h4>核心法规</h4>${core||'<span style="color:#aaa">—</span>'}</div>
        ${srcs?'<div class="sect"><h4>来源推文</h4>'+srcs+'</div>':''}</div>
    </div>`;
}
function pick(c,i){curLayer=i;render();}
sel.addEventListener('change',()=>{curLayer=0;render();});
render();
</script></body></html>
